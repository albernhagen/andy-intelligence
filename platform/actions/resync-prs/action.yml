name: Baseline — Re-sync open PRs
description: >-
  When the default branch moves, merges it into each open same-repo PR that lacks it, through
  GitHub's update-branch API (merge commit; never rebase or force). Clean merges only; a conflict
  gets one comment naming the files. Skips forks, drafts, the `no-auto-sync` label, agent PRs and
  Dependabot. Capped: 12 runs that re-synced an hour, 20 PRs a run, 3 updates per PR a day
  (scripts/resync-prs.mjs, ADR-0111, ADR-0139). Needs a checkout of the default branch with full
  history, a job token with `contents: read` and `pull-requests: read`, and `id-token: write` for
  the control plane's write token (POST /github/token, ADR-0043). First reads the project's PR sync
  setting with the same OIDC token (POST /github/pr-sync, AI-388): `queue` writes nothing.

inputs:
  github-token:
    description: The job's GITHUB_TOKEN (reads only).
    required: true
  control-plane-url:
    description: The control plane's public URL, also the OIDC audience.
    required: true

runs:
  using: composite
  steps:
    - name: Re-sync open PRs
      shell: bash
      env:
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        READ_TOKEN: ${{ inputs.github-token }}
        CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
      run: |
        BASELINE=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)
        node "$BASELINE/scripts/resync-prs.mjs"
