name: Baseline — secret scan
description: >-
  TruffleHog over the commits in the PR/push range; fails on verified or unverifiable secrets
  (ADR-0015, project baseline ADR-0031/ADR-0038). Run after actions/checkout with fetch-depth 0.

runs:
  using: composite
  steps:
    - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
      with:
        extra_args: --results=verified,unknown
