name: Baseline — UI screenshots
description: >-
  Playwright screenshot checks for a web app (ADR-0059: Visual checks, project baseline ADR-0031/ADR-0038).
  Runs `playwright test` in the app's folder and fails on any diff from the stored images; on failure
  uploads the actual, expected and diff images as the `ui-screenshots` artifact. With `base-ref`
  set (a PR), scripts/review-scope.mjs --gate reports a pass without running for a docs-only change
  (the review agents' rule) or one where no changed file can affect what the web app renders
  (AI-406); if the change can't be read, a path is unknown, or the gate itself changed, it runs. Run after actions/checkout (fetch-depth 2
  on a PR), in the Playwright container image so renders match the stored ones; the image's version
  must match the locked `@playwright/test` (scripts/playwright-image.mjs), or the job fails first.

inputs:
  working-directory:
    description: The web app's folder (holds playwright.config.ts).
    default: apps/web
  base-ref:
    description: Ref to diff HEAD against to skip a change that can't alter the web app (HEAD^1 on a PR merge commit). Empty runs always.
    default: ""

runs:
  using: composite
  steps:
    - name: Can this change alter the web app?
      id: scope
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        if [ -z "$BASE_REF" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # The container's checkout is owned by another user; let git read it.
        git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
        # A PR that edits the gate, the image check, this action or its workflow runs the suite
        # without asking the gate, so a broken gate can't skip its own change (AI-406).
        # (An unreadable diff falls through to the gate, which runs on any failure.)
        changed=$(git diff --name-only --no-renames "$BASE_REF" HEAD 2>/dev/null || true)
        if grep -qE '^(scripts/review-scope\.mjs|scripts/playwright-image\.mjs|\.github/workflows/ui-screenshots\.yml|platform/actions/ui-screenshots/)' <<< "$changed"; then
          echo "The screenshot gate itself changed: running."
          echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # git's own error, if any, is printed above this line; a fallback says so.
        out=$(node "$GITHUB_ACTION_PATH/../../../scripts/review-scope.mjs" --gate "$BASE_REF") || { echo "gate failed: running"; out=run=true; }
        run=$(printf '%s\n' "$out" | sed -n 's/^run=//p')
        reason=$(printf '%s\n' "$out" | sed -n 's/^reason=//p')
        [ "$run" = false ] || run=true
        echo "Screenshot gate against $BASE_REF: run=$run${reason:+ ($reason)}, $(grep -c . <<< "$changed" || true) files changed"
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [ "$run" = false ]; then
          echo "UI screenshots: skipped, ${reason:-no reason given}." | tee -a "$GITHUB_STEP_SUMMARY"
        fi
    # The browsers come from the job's image, so its version must match the locked package
    # (AI-394); a mismatch fails here in seconds, naming the fix, instead of at every test.
    - name: Playwright image matches the package
      if: steps.scope.outputs.run == 'true'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/playwright-image.mjs" "$GITHUB_WORKSPACE"
    - if: steps.scope.outputs.run == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - if: steps.scope.outputs.run == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # No install scripts: the root `prepare` (git hooks) fails on the container's checkout
    # ownership, and the image already has the browsers.
    - if: steps.scope.outputs.run == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Screenshot checks
      if: steps.scope.outputs.run == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm exec playwright test
    - name: Upload actual images
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-screenshots
        path: |
          ${{ inputs.working-directory }}/test-results/
          ${{ inputs.working-directory }}/playwright-report/
        retention-days: 14
        if-no-files-found: ignore
