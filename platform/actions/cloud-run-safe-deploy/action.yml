name: Baseline — Cloud Run safe deploy
description: >-
  Deploys an already-pushed image as a no-traffic revision tagged `candidate`, smoke tests it with
  the caller's checks, then moves all traffic to it and checks the public URL. A failure before promotion leaves traffic
  alone; the job summary names the revisions and the rollback command (ADR-0076). The caller
  authenticates to GCP first and holds credentials only on push to main or workflow_dispatch.

inputs:
  service:
    description: Cloud Run service name.
    required: true
  region:
    description: Cloud Run region.
    required: true
  image:
    description: Full image reference to deploy.
    required: true
  smoke-checks:
    description: >-
      Checks on the public host (the service's PUBLIC_URL env, else its run.app URL), one per line:
      `<path> <status>[,<status>…]`, e.g. `/health 200`. Also run on the candidate's tagged URL when
      the service has no PUBLIC_URL. At least one; the deploy fails before it starts without one.
    required: true
  smoke-checks-other-hosts:
    description: >-
      Checks on every other host (the candidate's tagged URL, the run.app URL) while PUBLIC_URL is
      set, same format: for an app with a host guard that answers differently there. Empty: the
      same as `smoke-checks`.
    required: false
    default: ""
  keep-tag-prefix:
    description: >-
      When set (e.g. `release-`), the image, which must be by digest, gets the tag
      `<prefix><digest hex>` after the candidate passes its smoke checks and before traffic moves,
      so registry cleanup keeps what prod runs (AI-389; project-env `image_keep_tag_prefixes`). A
      failed tag stops the deploy with traffic unmoved. Needs tag write on the image's repo. Empty:
      no tag (a dev deploy).
    required: false
    default: ""

outputs:
  candidate:
    description: The candidate revision this deploy made; empty if none was made.
    value: ${{ steps.candidate.outputs.revision }}
  keep-tag:
    description: The registry tag this deploy added (`<repo>/<name>:<prefix><hex>`); empty if none.
    value: ${{ steps.keep-tag.outcome == 'success' && steps.inputs.outputs.target || '' }}
  promoted:
    description: "`true` once traffic was moved to the candidate, even if a later check failed."
    value: ${{ steps.promote.outcome == 'success' }}

runs:
  using: composite
  steps:
    # Before any cloud call: a bad or missing check list, a bad keep tag prefix or an image not by
    # digest fails here, not after the candidate exists.
    - name: Check the inputs
      id: inputs
      shell: bash
      env:
        SMOKE_CHECKS: ${{ inputs.smoke-checks }}
        SMOKE_CHECKS_OTHER_HOSTS: ${{ inputs.smoke-checks-other-hosts }}
        IMAGE: ${{ inputs.image }}
        KEEP_TAG_PREFIX: ${{ inputs.keep-tag-prefix }}
      run: |
        node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" check-smoke-inputs
        if [ -n "$KEEP_TAG_PREFIX" ]; then
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" keep-tag
        fi

    - name: Record the serving revision
      id: before
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" serving

    - name: Deploy the candidate with no traffic
      id: deploy
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ inputs.service }}
        region: ${{ inputs.region }}
        image: ${{ inputs.image }}
        no_traffic: "true"
        tag: candidate

    - name: Identify the candidate
      id: candidate
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" candidate

    - name: Smoke test the candidate
      id: smoke
      shell: bash
      env:
        TAGGED_URL: ${{ steps.candidate.outputs.tagged_url }}
        PUBLIC_URL: ${{ steps.candidate.outputs.public_url }}
        SMOKE_CHECKS: ${{ inputs.smoke-checks }}
        SMOKE_CHECKS_OTHER_HOSTS: ${{ inputs.smoke-checks-other-hosts }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" smoke-candidate

    # Before traffic moves: once it serves, cleanup must not delete it. A tag on a candidate that
    # later fails is harmless; an untagged image serving prod is not.
    - name: Tag the image so registry cleanup keeps it
      id: keep-tag
      if: inputs.keep-tag-prefix != ''
      shell: bash
      env:
        SOURCE: ${{ steps.inputs.outputs.source }}
        TARGET: ${{ steps.inputs.outputs.target }}
      run: gcloud artifacts docker tags add "$SOURCE" "$TARGET" --quiet

    # --to-latest, not --to-revisions: traffic stays on LATEST, so a later Terraform apply that
    # changes the template still goes live, as it always has (ADR-0076).
    - name: Move traffic to the candidate
      id: promote
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        CANDIDATE: ${{ steps.candidate.outputs.revision }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" assert-latest "$CANDIDATE"
        gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --remove-tags=candidate --quiet

    - name: Check the candidate serves all traffic
      id: verify
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        CANDIDATE: ${{ steps.candidate.outputs.revision }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" assert-promoted "$CANDIDATE"

    - name: Smoke test the public URL
      id: public-smoke
      shell: bash
      env:
        PUBLIC_URL: ${{ steps.candidate.outputs.public_url }}
        RUN_URL: ${{ steps.candidate.outputs.run_url }}
        SMOKE_CHECKS: ${{ inputs.smoke-checks }}
        SMOKE_CHECKS_OTHER_HOSTS: ${{ inputs.smoke-checks-other-hosts }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" smoke-public

    # A failed candidate must not stay reachable on its tagged URL (ADR-0076).
    - name: Remove the candidate tag after a failed deploy
      id: untag
      if: always() && steps.deploy.outcome != 'skipped' && steps.promote.outcome != 'success'
      continue-on-error: true
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags=candidate --quiet

    - name: Read the serving revision
      id: after
      if: always()
      continue-on-error: true
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" after

    - name: Write the job summary
      if: always()
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        BEFORE: ${{ steps.before.outputs.serving }}
        CANDIDATE: ${{ steps.candidate.outputs.revision }}
        AFTER: ${{ steps.after.outputs.serving }}
        KEEP_TAG: ${{ steps.inputs.outputs.target }}
        OUTCOME_INPUTS: ${{ steps.inputs.outcome }}
        OUTCOME_BEFORE: ${{ steps.before.outcome }}
        OUTCOME_DEPLOY: ${{ steps.deploy.outcome }}
        OUTCOME_CANDIDATE: ${{ steps.candidate.outcome }}
        OUTCOME_SMOKE: ${{ steps.smoke.outcome }}
        OUTCOME_KEEP_TAG: ${{ steps.keep-tag.outcome }}
        OUTCOME_PROMOTE: ${{ steps.promote.outcome }}
        OUTCOME_VERIFY: ${{ steps.verify.outcome }}
        OUTCOME_PUBLIC_SMOKE: ${{ steps.public-smoke.outcome }}
        OUTCOME_UNTAG: ${{ steps.untag.outcome }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" summary
