name: Baseline — Cloud Run rollback
description: >-
  Pins 100 percent of a Cloud Run service's traffic to an earlier revision, checks it serves all of
  it, then checks `/health` on the service's URL (AI-190: M6.11, ADR-0114). The job summary names
  the revisions before and after and the command that returns to what served before. Run
  `cloud-run-release-check` first: it fails before traffic moves if the revision is not the
  service's or not ready. The caller authenticates to GCP first.

inputs:
  service:
    description: Cloud Run service name.
    required: true
  region:
    description: Cloud Run region.
    required: true
  revision:
    description: The revision to return to.
    required: true
  url:
    description: Where the service answers, for the `/health` check.
    required: true

runs:
  using: composite
  steps:
    - name: Record the serving revision
      id: before
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" serving

    - name: Pin traffic to the revision
      id: pin
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        REVISION: ${{ inputs.revision }}
      run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions="$REVISION=100" --quiet

    - name: Check the revision serves all traffic
      id: verify
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        REVISION: ${{ inputs.revision }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-release.mjs" assert-pinned "$REVISION"

    - name: Check /health
      id: health
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-release.mjs" health

    - name: Read the serving revision
      id: after
      if: always()
      continue-on-error: true
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: |
        gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
          node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-deploy.mjs" after

    - name: Write the job summary
      if: always()
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        REVISION: ${{ inputs.revision }}
        BEFORE: ${{ steps.before.outputs.serving }}
        AFTER: ${{ steps.after.outputs.serving }}
        OUTCOME_PIN: ${{ steps.pin.outcome }}
        OUTCOME_VERIFY: ${{ steps.verify.outcome }}
        OUTCOME_HEALTH: ${{ steps.health.outcome }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/cloud-run-release.mjs" summary
