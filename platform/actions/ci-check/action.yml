name: Baseline — check
description: >-
  Lockfile sources, lint, context budget, typecheck, test with coverage and build a pnpm repo (ADR-0022, ADR-0046, project baseline ADR-0031/ADR-0038).
  Needs package.json (packageManager pinned), pnpm-lock.yaml, .nvmrc, the scripts
  lint, typecheck, test (vitest), build, and @vitest/coverage-v8 with coverage floors in the vitest
  config (AI-407). Run after actions/checkout. `part` picks one piece so a caller can
  run them as parallel jobs (AI-402); `part: result` is the final gate over those jobs' results.

inputs:
  part:
    description: >-
      all (every step in order), lint (lockfile sources, lint, context budget), typecheck, test
      (with coverage and its floors), build, or result (fails unless every job in `results`
      succeeded; installs nothing).
    default: all
  results:
    description: With part result, the caller's `toJSON(needs)`.
    default: ""

runs:
  using: composite
  steps:
    # An unknown part would otherwise run no step and pass.
    - name: Check inputs
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: |
        case "$PART" in all|lint|typecheck|test|build|result) ;; *) echo "::error::Unknown part '$PART'"; exit 1 ;; esac
    # The required `check`: passes only when every needed job's result is `success`. A failed,
    # skipped or cancelled part fails it, and so does an empty list (AI-402).
    - name: Every part passed
      if: inputs.part == 'result'
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/ci-check-result.mjs"
    - if: inputs.part != 'result'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - if: inputs.part != 'result'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.part != 'result'
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Lockfile sources (ADR-0046)
      if: inputs.part == 'all' || inputs.part == 'lint'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/lockfile-sources.mjs"
    - if: inputs.part == 'all' || inputs.part == 'lint'
      shell: bash
      run: pnpm lint
    - name: Context budget (ADR-0046)
      if: inputs.part == 'all' || inputs.part == 'lint'
      shell: bash
      # On a PR: only the PR's own change fails it. On a push to the default branch: warns, never
      # fails; the context-budget-trim job records the trim (AI-344, ADR-0138).
      env:
        REPORT: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && '--report' || '' }}
      run: node "$GITHUB_ACTION_PATH/../../../scripts/context-budget.mjs" $REPORT
    - if: inputs.part == 'all' || inputs.part == 'typecheck'
      shell: bash
      run: pnpm typecheck
    # The whole suite in one run, with coverage (AI-407): vitest fails it when a package drops
    # below its floor (`coverage.thresholds` in the vitest config), or when it finds no test files.
    - if: inputs.part == 'all' || inputs.part == 'test'
      id: test
      shell: bash
      run: |
        if ! node -e 'require.resolve("@vitest/coverage-v8/package.json", { paths: [process.cwd()] })' 2>/dev/null; then
          echo "::error::@vitest/coverage-v8 is not installed: add it as a dev dependency at the same version as vitest (AI-407: test coverage)"
          exit 1
        fi
        pnpm test --coverage
    # Per-package table and, on a PR, changed-line coverage (a warning, never a failure) in the job
    # summary. It runs when the floors fail too, so the table shows what dropped. The PR's change is
    # HEAD^1..HEAD of the merge commit a pull_request checks out (the caller fetches depth 2).
    - name: Coverage report
      if: (success() || failure()) && steps.test.conclusion != 'skipped' && (inputs.part == 'all' || inputs.part == 'test')
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
      run: |
        DIFF=""
        if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^1 >/dev/null; then
          DIFF="$RUNNER_TEMP/pr.diff"
          git diff --unified=0 HEAD^1 HEAD > "$DIFF"
        fi
        node "$GITHUB_ACTION_PATH/../../../scripts/coverage-report.mjs" coverage $DIFF
    - if: inputs.part == 'all' || inputs.part == 'build'
      shell: bash
      run: pnpm build
