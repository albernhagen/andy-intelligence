name: Baseline — check
description: >-
  Lockfile sources, lint, context budget, typecheck, test and build a pnpm repo (ADR-0022, ADR-0046, project baseline ADR-0031/ADR-0038).
  Needs package.json (packageManager pinned), pnpm-lock.yaml, .nvmrc and the scripts
  lint, typecheck, test, build. Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Lockfile sources (ADR-0046)
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/lockfile-sources.mjs"
    - shell: bash
      run: pnpm lint
    - name: Context budget (ADR-0046)
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../scripts/context-budget.mjs"
    - shell: bash
      run: pnpm typecheck
    - shell: bash
      run: pnpm test
    - shell: bash
      run: pnpm build
