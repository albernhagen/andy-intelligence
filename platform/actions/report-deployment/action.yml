name: Baseline — report a deployment
description: >-
  Reports a deployment to the control plane (AI-180: M6.4, AI-190: M6.11): `start` before the
  deploy, promote or rollback (image digest, and optionally environment, kind, url and request;
  the repo and workflow come from the job's OIDC token), `finish` after it (status and the serving
  revision). Only `deploy.yml` and `release.yml` on `main` are accepted. Authenticated with the job's GitHub Actions OIDC token (ADR-0019), so the
  calling job needs `id-token: write`. Never fails the job: any error becomes a warning and a line
  in the job summary saying the deployment was not recorded.

inputs:
  control-plane-url:
    description: The control plane's origin, also the OIDC audience.
    required: true
  phase:
    description: "`start` or `finish`."
    required: true
  image-digest:
    description: "`start`: the deployed image's digest (`sha256:…`)."
    required: false
    default: ""
  environment:
    description: "`start`: `dev` or `prod` (optional; the control plane assumes `prod`)."
    required: false
    default: ""
  kind:
    description: "`start`: `deploy`, `promote` or `rollback` (optional; `deploy` when empty)."
    required: false
    default: ""
  url:
    description: "`start`: the environment's https URL, where verification tests run (optional)."
    required: false
    default: ""
  request:
    description: "`start`: the control plane's request id for a promote or rollback (optional)."
    required: false
    default: ""
  deployment-id:
    description: "`finish`: the id the `start` report returned."
    required: false
    default: ""
  status:
    description: "`finish`: `succeeded` or `failed`."
    required: false
    default: ""
  revision:
    description: "`finish`: the revision the caller moved traffic to, sent with either status; wins over `service`."
    required: false
    default: ""
  service:
    description: "`finish`: the Cloud Run service, to read the serving revision (optional)."
    required: false
    default: ""
  region:
    description: "`finish`: the Cloud Run region (with `service`)."
    required: false
    default: ""

outputs:
  deployment-id:
    description: The recorded deployment's id (`start`); empty when it was not recorded.
    value: ${{ steps.report.outputs.deployment_id }}
  refused:
    description: >-
      `start`: `true` when the control plane refused the report (HTTP 422: the kind, or no succeeded
      deployment of that digest); empty otherwise, including when it was unreachable.
    value: ${{ steps.report.outputs.refused }}

runs:
  using: composite
  steps:
    - name: Report the deployment
      id: report
      shell: bash
      env:
        CONTROL_PLANE_URL: ${{ inputs.control-plane-url }}
        PHASE: ${{ inputs.phase }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        ENVIRONMENT: ${{ inputs.environment }}
        KIND: ${{ inputs.kind }}
        URL: ${{ inputs.url }}
        REQUEST: ${{ inputs.request }}
        REVISION: ${{ inputs.revision }}
        DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        STATUS: ${{ inputs.status }}
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
      run: bash "$GITHUB_ACTION_PATH/report.sh"
