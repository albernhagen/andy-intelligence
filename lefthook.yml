# Local quality gates (ADR-0027). Installed by `pnpm install` (root `prepare` script).
# Same tools and config as CI; CI stays the backstop.

pre-commit:
  parallel: true
  commands:
    prettier:
      # CLAUDE.md files are symlinks to AGENTS.md; prettier refuses symlinks passed by name.
      exclude: ["CLAUDE.md", "**/CLAUDE.md"]
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    terraform-fmt:
      glob: "*.tf"
      run: terraform fmt -check {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint {staged_files}
        else
          echo "actionlint not installed (brew install actionlint); skipped, CI still checks"
        fi

# Pre-push runs only the tests the branch can affect, so parallel worktrees pushing at once don't
# starve each other (ADR-0113). vitest --changed follows imports from every file that differs from
# origin/main; a changed package.json or vitest config reruns everything. CI still runs the full
# suite and gates every merge. Without an origin/main ref, the full suite runs here.
pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: |
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          pnpm exec vitest run --changed origin/main --passWithNoTests
        else
          pnpm test
        fi
