name: Preview

# From the andy-intelligence project baseline, `cloud-run` deploy kind (AI-207: M6.18; ADR-0114,
# "PR previews"). Managed: the baseline rewrites this file, so change it there. On a same-repo PR:
# build the PR's image, push it to the preview registry, deploy it to `<service>-preview` as a
# no-traffic revision tagged `pr-<n>` (at most 10 per service, oldest removed first) and comment its
# URL. On close: remove the tag. Forks and Dependabot PRs never run a job, so they never get a GCP
# credential. Repo variables: docs/features/deploy-caller.md in andy-intelligence.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**.md"

# One run per PR. A new push cancels the build in flight; a close waits for it, then removes the tag.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC → the preview deployer, which federates only from pull_request runs
      pull-requests: write # the one preview comment
    # Same-repo PRs only, checked before any step: GitHub gives fork runs no id-token anyway, and
    # Dependabot runs get a read-only token, so neither could deploy.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Before any cloud call or build: fails naming every missing repo variable.
      - id: config
        uses: ./platform/actions/cloud-run-caller-config
        with:
          workflow: preview
          vars: ${{ toJSON(vars) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project-id }}
          workload_identity_provider: ${{ steps.config.outputs.wif-provider }}
          service_account: ${{ steps.config.outputs.preview-deployer-sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ steps.config.outputs.region }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The preview registry only: the preview deployer can't write the image main deploys.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.config.outputs.preview-image }}:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview

      - uses: ./platform/actions/cloud-run-preview
        with:
          mode: deploy
          service: ${{ steps.config.outputs.preview-service }}
          region: ${{ steps.config.outputs.region }}
          project-id: ${{ steps.config.outputs.project-id }}
          pr: ${{ github.event.pull_request.number }}
          image: ${{ steps.config.outputs.preview-image }}@${{ steps.build.outputs.digest }}
          github-token: ${{ github.token }}

  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC → the preview deployer (a closed PR is still a pull_request run)
      pull-requests: write # marks the comment removed
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - id: config
        uses: ./platform/actions/cloud-run-caller-config
        with:
          workflow: preview
          vars: ${{ toJSON(vars) }}

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project-id }}
          workload_identity_provider: ${{ steps.config.outputs.wif-provider }}
          service_account: ${{ steps.config.outputs.preview-deployer-sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: ./platform/actions/cloud-run-preview
        with:
          mode: remove
          service: ${{ steps.config.outputs.preview-service }}
          region: ${{ steps.config.outputs.region }}
          project-id: ${{ steps.config.outputs.project-id }}
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
