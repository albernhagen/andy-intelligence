name: Release

# From the andy-intelligence project baseline, `cloud-run` deploy kind (AI-206: M6.17; ADR-0114,
# "The release contract every kind meets"); the control plane's own release.yml (AI-190: M6.11)
# with its values read from repo variables. Managed: the baseline rewrites this file. Started only
# by workflow_dispatch on main: by the control plane with its GitHub App token, or by hand from the
# Actions tab. Inputs show in public run logs, so they carry no secrets.
on:
  workflow_dispatch:
    inputs:
      action:
        description: promote (ship an image digest) or rollback (return to a revision)
        type: choice
        options: [rollback, promote]
        required: true
      environment:
        description: The environment to change
        type: choice
        options: [prod, dev]
        required: true
      digest:
        description: "promote: a succeeded deployment's image digest (sha256:…)"
        type: string
        required: false
        default: ""
      revision:
        description: "rollback: a succeeded deployment's revision"
        type: string
        required: false
        default: ""
      request:
        description: The control plane's request id (empty when run by hand)
        type: string
        required: false
        default: ""

# One release or deploy at a time per environment: deploy.yml uses the same group. A dispatch off
# main gets a group of its own, so it can't push a waiting release or deploy out of the queue.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('deploy-{0}', inputs.environment) || format('off-main-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

env:
  # The control plane's public URL (also the OIDC audience for deployment reports). Not secret.
  CONTROL_PLANE_URL: https://ai.andybernhagen.com

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → Workload Identity Federation and the deployment report; dispatch only
    # The deployer identity is bound to refs/heads/main; a dispatch on any other ref does nothing.
    if: github.ref == 'refs/heads/main'
    steps:
      # Before any cloud call: the inputs, and every repo variable the environment needs.
      - id: config
        uses: ./platform/actions/cloud-run-caller-config
        with:
          workflow: release
          vars: ${{ toJSON(vars) }}
          action: ${{ inputs.action }}
          environment: ${{ inputs.environment }}
          digest: ${{ inputs.digest }}
          revision: ${{ inputs.revision }}
          request: ${{ inputs.request }}

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project-id }}
          workload_identity_provider: ${{ steps.config.outputs.wif-provider }}
          service_account: ${{ steps.config.outputs.deployer-sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Fails before traffic changes if the digest or revision does not exist.
      - id: check
        uses: ./platform/actions/cloud-run-release-check
        with:
          action: ${{ steps.config.outputs.action }}
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
          image: ${{ steps.config.outputs.source-image }}
          digest: ${{ steps.config.outputs.digest }}
          revision: ${{ steps.config.outputs.revision }}

      # Deployment record (AI-180: M6.4, ADR-0019). Never fails the release.
      - id: report-start
        uses: ./platform/actions/report-deployment
        with:
          control-plane-url: ${{ env.CONTROL_PLANE_URL }}
          phase: start
          image-digest: ${{ steps.check.outputs.image-digest }}
          environment: ${{ steps.config.outputs.environment }}
          kind: ${{ steps.config.outputs.action }}
          url: ${{ steps.config.outputs.service-url }}
          request: ${{ steps.config.outputs.request }}

      # A promote ships only a digest the control plane knows dev deployed successfully: its 422
      # stops the run here. An unreachable control plane doesn't (a lost report never fails a
      # release); a rollback isn't gated, so an emergency rollback never waits on the API.
      - id: gate
        name: Stop a promote the control plane refused
        if: steps.config.outputs.action == 'promote' && steps.report-start.outputs.refused == 'true'
        run: |
          echo "::error::The control plane refused this promote: no succeeded dev deployment of that digest."
          exit 1

      # Promote: the same image by digest, no-traffic revision, smoke test, then traffic (ADR-0076).
      - id: promote
        if: steps.config.outputs.action == 'promote'
        uses: ./platform/actions/cloud-run-safe-deploy
        with:
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
          image: ${{ steps.config.outputs.source-image }}@${{ steps.check.outputs.image-digest }}
          smoke-checks: ${{ vars.DEPLOY_SMOKE_CHECKS }}
          smoke-checks-other-hosts: ${{ vars.DEPLOY_SMOKE_CHECKS_OTHER_HOSTS }}
          # Prod's image gets a release- tag so registry cleanup keeps it (AI-389: M6.23).
          keep-tag-prefix: ${{ steps.config.outputs.environment == 'prod' && 'release-' || '' }}

      # Rollback: pin all traffic to the revision, then check /health.
      - id: rollback
        if: steps.config.outputs.action == 'rollback'
        uses: ./platform/actions/cloud-run-rollback
        with:
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
          revision: ${{ steps.config.outputs.revision }}
          url: ${{ steps.check.outputs.url }}

      - if: always() && steps.report-start.outputs.deployment-id != ''
        uses: ./platform/actions/report-deployment
        with:
          control-plane-url: ${{ env.CONTROL_PLANE_URL }}
          phase: finish
          deployment-id: ${{ steps.report-start.outputs.deployment-id }}
          status: ${{ (steps.promote.outcome == 'success' || steps.rollback.outcome == 'success') && 'succeeded' || 'failed' }}
          # Whatever traffic moved to, even if a later check failed, so the record says what serves.
          revision: ${{ steps.rollback.outputs.pinned == 'true' && steps.config.outputs.revision || steps.promote.outputs.promoted == 'true' && steps.promote.outputs.candidate || '' }}
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
