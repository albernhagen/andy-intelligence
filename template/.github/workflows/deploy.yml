name: Deploy

# From the andy-intelligence project baseline, `cloud-run` deploy kind (AI-206: M6.17; ADR-0114).
# Managed: the baseline rewrites this file, so change it there. On push to main: build the image
# once, push it to the first environment's registry (dev, or prod without one), deploy it with a
# no-traffic revision, smoke test, then traffic (ADR-0076), and report the deployment to the control
# plane. Repo variables: docs/features/deploy-caller.md in andy-intelligence.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**.md"
  workflow_dispatch:

# One deploy or release at a time per environment: release.yml uses the same group.
concurrency:
  group: ${{ vars.GCP_DEV_WIF_PROVIDER != '' && 'deploy-dev' || 'deploy-prod' }}
  cancel-in-progress: false

permissions: {}

env:
  # The control plane's public URL (also the OIDC audience for deployment reports). Not secret.
  CONTROL_PLANE_URL: https://ai.andybernhagen.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → Workload Identity Federation; push to main or dispatch only
    # The deployer identity federates only from this file on refs/heads/main (project-env). Merges
    # made by a bot (Dependabot auto-merge) never deploy, as in the control plane; the next one does.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    steps:
      # Before any cloud call or build: fails naming every missing repo variable.
      - id: config
        uses: ./platform/actions/cloud-run-caller-config
        with:
          workflow: deploy
          vars: ${{ toJSON(vars) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project-id }}
          workload_identity_provider: ${{ steps.config.outputs.wif-provider }}
          service_account: ${{ steps.config.outputs.deployer-sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ steps.config.outputs.region }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.config.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployment record (AI-180: M6.4, ADR-0019). Never fails the deploy.
      - id: report-start
        uses: ./platform/actions/report-deployment
        with:
          control-plane-url: ${{ env.CONTROL_PLANE_URL }}
          phase: start
          image-digest: ${{ steps.build.outputs.digest }}
          environment: ${{ steps.config.outputs.environment }}
          kind: deploy
          url: ${{ steps.config.outputs.service-url }}

      # The digest just built, so promote later ships exactly this image.
      - id: deploy
        uses: ./platform/actions/cloud-run-safe-deploy
        with:
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
          image: ${{ steps.config.outputs.image }}@${{ steps.build.outputs.digest }}
          smoke-checks: ${{ vars.DEPLOY_SMOKE_CHECKS }}
          smoke-checks-other-hosts: ${{ vars.DEPLOY_SMOKE_CHECKS_OTHER_HOSTS }}
          # Prod's image gets a release- tag so registry cleanup keeps it (AI-389: M6.23).
          keep-tag-prefix: ${{ steps.config.outputs.environment == 'prod' && 'release-' || '' }}

      - if: always() && steps.report-start.outputs.deployment-id != ''
        uses: ./platform/actions/report-deployment
        with:
          control-plane-url: ${{ env.CONTROL_PLANE_URL }}
          phase: finish
          deployment-id: ${{ steps.report-start.outputs.deployment-id }}
          status: ${{ steps.deploy.outcome == 'success' && 'succeeded' || 'failed' }}
          revision: ${{ steps.deploy.outputs.promoted == 'true' && steps.deploy.outputs.candidate || '' }}
          service: ${{ steps.config.outputs.service }}
          region: ${{ steps.config.outputs.region }}
