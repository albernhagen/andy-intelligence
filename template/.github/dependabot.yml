# Dependabot version updates (project baseline, ADR-0031). Action pins are commit SHAs with a
# version comment; Dependabot updates both, including the andy-intelligence baseline actions.
# Caps: weekly, grouped, at most 5 open PRs per ecosystem. cooldown waits a few days after a
# release, so a hijacked release is usually caught first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Playwright gets a PR of its own: the screenshot job's browser image (pinned by digest in
        # a workflow) must move with it, and the job fails naming the fix until it does (AI-394).
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
    ignore:
      # @types/node majors track the Node runtime in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
