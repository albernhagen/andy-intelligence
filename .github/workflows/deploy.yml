name: Deploy control plane

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC → Workload Identity Federation

env:
  REGION: us-central1
  SERVICE: control-plane

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip until infra exists and the repo variables are set (see docs/runbooks/m0-setup.md).
    if: vars.GCP_WIF_PROVIDER != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_IMAGE_REPO }}/control-plane:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ vars.GCP_IMAGE_REPO }}/control-plane:${{ github.sha }}

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          curl -fsS "$url/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/me")
          test "$code" = "401"
