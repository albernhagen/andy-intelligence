name: CI

# Project baseline caller (ADR-0031, ADR-0038): the steps live in platform/actions/. Job names are
# the required checks in the `main` ruleset; don't rename them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `check` runs as parallel parts (AI-402): lint, typecheck, two test shards and build, each a
  # `part` of platform/actions/ci-check. The final `check` job is the required check: it always
  # runs and passes only when every part's result is `success`, so a failed, skipped or cancelled
  # part fails it.
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/ci-check
        with:
          part: lint

  check-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/ci-check
        with:
          part: typecheck

  check-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failed shard doesn't cancel the other, so its own failures still show.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/ci-check
        with:
          part: test
          test-shard: ${{ matrix.shard }}/2

  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/ci-check
        with:
          part: build

  check:
    needs: [check-lint, check-typecheck, check-test, check-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/ci-check
        with:
          part: result
          results: ${{ toJSON(needs) }}

  # On main only: files over their context budget get one trim issue instead of a red check
  # (AI-344, ADR-0138). It holds an issues-write token, so it runs only on pushes to main, whose
  # checkout is main's own code: nothing from a PR runs here.
  context-budget-trim:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time, so two quick merges can't both find no issue and open two.
    concurrency:
      group: context-budget-trim
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/context-budget-trim
        with:
          github-token: ${{ github.token }}

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/actionlint

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./platform/actions/terraform-check
