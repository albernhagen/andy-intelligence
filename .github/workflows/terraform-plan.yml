name: Terraform plan

# Public repo: logs are world-readable, so only the plan's summary line is printed.
# Andy reviews the full plan locally before applying (ADR-0011).

on:
  pull_request:
    paths:
      - "infra/control-plane/**"
  workflow_dispatch:
  # The system security review calls this for a drift summary (addresses only, no values).
  workflow_call:
    outputs:
      summary:
        description: Plan summary line, such as No changes. or the Plan counts line
        value: ${{ jobs.plan.outputs.summary }}
      changes:
        description: Addresses of resources that would change, one per line
        value: ${{ jobs.plan.outputs.changes }}

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    # Never run for fork PRs, and skip until infra variables exist.
    if: >-
      vars.GCP_WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      summary: ${{ steps.plan.outputs.summary }}
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: infra/control-plane
    env:
      TF_VAR_allowed_emails: ${{ secrets.TF_VAR_ALLOWED_EMAILS }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check variable secrets
        run: |
          if [ -z "$TF_VAR_allowed_emails" ]; then
            echo "::error::Repository secret TF_VAR_ALLOWED_EMAILS is not set (HCL list, e.g. [\"you@example.com\"]). See docs/runbooks/m0-setup.md step 3."
            exit 1
          fi
          if [ -z "$TF_VAR_alert_email" ]; then
            echo "::error::Repository secret TF_VAR_ALERT_EMAIL is not set (plain address, no quotes). See docs/runbooks/billing.md."
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - run: terraform init -input=false > /dev/null
      # Read-only identity: no state lock, no apply.
      - name: Plan (summary only)
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1 && rc=0 || rc=$?
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt || echo "plan failed (exit $rc); run it locally for details")
          echo "::notice title=terraform plan (control-plane)::$summary"
          # Which resources change (addresses only, no values).
          grep -E '^  # .+ (will|must) be ' plan.txt | sed 's/^  # /::notice title=plan change::/' | head -30 || true
          # On failure print only Terraform's one-line error headlines (no resource values).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then grep -E '^(│ )?Error: ' plan.txt | sed 's/^│ //' | sort -u | head -20 | sed 's/^/::error::/' || true; fi
          echo "### terraform plan (control-plane): $summary" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "summary=$summary"
            echo "changes<<CHANGES_EOF"
            grep -E '^  # .+ (will|must) be ' plan.txt | sed 's/^  # //' | head -30 || true
            echo "CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f plan.txt
          # 0 = no changes, 2 = changes present; anything else is an error.
          test "$rc" -eq 0 -o "$rc" -eq 2
