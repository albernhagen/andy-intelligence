name: Claude Code executor

# The platform's Claude Code executor (ARCHITECTURE §7.2, M1.6: Claude Code executor). A project's
# agent-run.yml calls it with a run ID; it fetches the run's prompt from the control plane, runs
# claude-code-action under the executor permission profile (ADR-0040) and reports the result back.
# The control plane accepts the callbacks only from this file on main: it checks the Actions OIDC
# token's `job_workflow_ref` (ADR-0019: Agent callbacks authenticated with GitHub Actions OIDC).
#
# Separate jobs so the agent's job never holds an OIDC token or a write token (as ADR-0043 does
# for the system review): `context` and `report` talk to the control plane; `agent` only has the
# model credential and a read-only repo token, and never runs before the profile is installed;
# for build runs (ADR-0063) `publish` checks the agent's change, pushes it with a 1-hour App
# token and opens the PR, running none of the change's code. A sync run (AI-72, ADR-0083) is a
# build-sandboxed run on an open agent PR: the agent job merges the default branch into the PR
# head before the agent, the agent resolves conflicts and runs the checks, and `publish` repeats
# the merge, applies only the agent's edits and pushes the merge commit as a fast forward.
# The prompt is ticket text: untrusted data. It travels in env, job outputs and the action's
# `prompt` input, never inside a `run:` script. So do the ticket title and the agent's output.

on:
  workflow_call:
    inputs:
      run_id:
        description: "Control-plane run ID (not secret)"
        type: string
        required: true
      credential:
        description: "Model credential: subscription (CLAUDE_CODE_OAUTH_TOKEN) or api_key (ANTHROPIC_API_KEY)"
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions: {}

env:
  # The control plane's public URL (also the OIDC audience). Not secret.
  CONTROL_PLANE_URL: https://ai.andybernhagen.com

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Actions OIDC token for GET /runs/{id}/context
    outputs:
      step: ${{ steps.context.outputs.step }}
      model: ${{ steps.context.outputs.model }}
      max_turns: ${{ steps.context.outputs.max_turns }}
      read_only: ${{ steps.context.outputs.read_only }}
      prompt: ${{ steps.context.outputs.prompt }}
      ticket_key: ${{ steps.context.outputs.ticket_key }}
      ticket_title: ${{ steps.context.outputs.ticket_title }}
      project_id: ${{ steps.context.outputs.project_id }}
      branch: ${{ steps.context.outputs.branch }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      base_branch: ${{ steps.context.outputs.base_branch }}
      platform_sha: ${{ steps.context.outputs.platform_sha }}
      error: ${{ steps.context.outputs.error }}
    steps:
      - name: Validate inputs and fetch the run context
        id: context
        env:
          RUN_ID: ${{ inputs.run_id }}
          CREDENTIAL: ${{ inputs.credential }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MAX_TURNS_CAP: 200 # spend cap per run (ADR-0028), whatever the control plane asks
          MAX_PROMPT_CHARS: 200000
        run: |
          fail() {
            echo "error=$1" >> "$GITHUB_OUTPUT"
            echo "::error title=claude-executor::$1"
            exit 1
          }
          [[ "$RUN_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]] || fail "run_id must be 1-64 letters, digits or hyphens"
          case "$CREDENTIAL" in
            subscription) [ "$HAS_OAUTH_TOKEN" = true ] || fail "credential=subscription but secret CLAUDE_CODE_OAUTH_TOKEN is empty" ;;
            api_key) [ "$HAS_API_KEY" = true ] || fail "credential=api_key but secret ANTHROPIC_API_KEY is empty" ;;
            *) fail "credential must be subscription or api_key" ;;
          esac

          oidc=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE_URL" | jq -r .value) || fail "could not get an Actions OIDC token"
          echo "::add-mask::$oidc"
          # The commit this reusable workflow runs from, from the token's job_workflow_sha claim
          # (actionlint doesn't know job.workflow_sha yet). The agent job checks the platform out there.
          payload=$(cut -d. -f2 <<<"$oidc" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          platform_sha=$(base64 -d <<<"$payload" | jq -r '.job_workflow_sha // empty') || platform_sha=""
          [[ "$platform_sha" =~ ^[0-9a-f]{40}$ ]] || platform_sha=""

          body="$RUNNER_TEMP/context.json"
          code=$(curl -sS --retry 2 --max-time 30 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc" "$CONTROL_PLANE_URL/runs/$RUN_ID/context") || code=000
          if [ "$code" != 200 ]; then
            fail "GET /runs/$RUN_ID/context returned HTTP $code: $(head -c 300 "$body" 2>/dev/null | tr -d '\r\n')"
          fi
          jq -e --arg id "$RUN_ID" --argjson cap "$MAX_TURNS_CAP" --argjson max "$MAX_PROMPT_CHARS" '
            (.runId == $id)
            and (.step | type == "string" and test("^[a-z][a-z-]{0,31}$"))
            and (.model | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"))
            and (.maxTurns | type == "number" and . == floor and . >= 1 and . <= $cap)
            and (.prompt | type == "string" and length > 0 and length <= $max)
            and (.step != "build" or (
              (.ticket.key | type == "string" and test("^[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}$"))
              and (.ticket.projectId | type == "string" and test("^[a-z][a-z0-9]{0,9}$"))
              and (.ticket.title | type == "string" and length > 0 and length <= 500)
              and (.branch == "agent/\(.ticket.key)/\($id)")))
            and (.step != "sync" or (
              (.ticket.key | type == "string" and test("^[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}$"))
              and (.ticket.projectId | type == "string" and test("^[a-z][a-z0-9]{0,9}$"))
              and (.ticket.title | type == "string" and length > 0 and length <= 500)
              and (.branch | type == "string" and test("^agent/[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}/[A-Za-z0-9-]{1,64}$"))
              and ((.branch | split("/") | .[1]) == .ticket.key)
              and (.sync.pullRequest | type == "number" and . == floor and . >= 1)
              and (.sync.headSha | type == "string" and test("^[0-9a-f]{40}$"))))
            and (.baseBranch == null or (
              (.step == "build")
              and (.baseBranch | type == "string" and test("^epic/[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}$"))
              and ((.baseBranch | ltrimstr("epic/") | split("-") | .[0]) == (.ticket.key | split("-") | .[0]))))
          ' "$body" > /dev/null || fail "GET /runs/$RUN_ID/context: unexpected response shape"

          # AI-122: a night launch's story builds on its epic branch; empty means the default
          # branch, as before. Checked again here before it becomes an output.
          base_branch=$(jq -r '.baseBranch // ""' "$body")
          [[ -z "$base_branch" || "$base_branch" =~ ^epic/[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}$ ]] || fail "unexpected base branch"

          step=$(jq -r .step "$body")
          case "$step" in refine | plan | review) read_only=true ;; *) read_only=false ;; esac
          {
            echo "step=$step"
            echo "model=$(jq -r .model "$body")"
            echo "max_turns=$(jq -r .maxTurns "$body")"
            echo "read_only=$read_only"
            echo "platform_sha=$platform_sha"
            echo "ticket_key=$(jq -r '.ticket.key // ""' "$body")"
            echo "project_id=$(jq -r '.ticket.projectId // ""' "$body")"
            echo "branch=$(jq -r '.branch // ""' "$body")"
            echo "head_sha=$(jq -r '.sync.headSha // ""' "$body")"
            echo "base_branch=$base_branch"
            # One line: the title can't hold a newline here, and the delimiter is random.
            echo "ticket_title=$(jq -r '.ticket.title // "" | gsub("[\\r\\n]+"; " ")' "$body")"
            delimiter="PROMPT_$(openssl rand -hex 16)"
            echo "prompt<<$delimiter"
            jq -r .prompt "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          rm -f "$body"
          echo "Run $RUN_ID: step $step, read-only $read_only."

  # Holds the model credential. The project is checked out from its default branch (not a PR).
  # Read-only steps only read it. A build run's agent edits it and runs its commands, but only
  # through Bash inside Claude Code's sandbox (ADR-0063): credentials unset and scrubbed, its own
  # PID namespace, writes limited to the checkout, network to the package registry only. The
  # job's own steps after the agent treat the checkout as hostile: git runs from a copy of .git
  # taken before the agent started, and nothing from the checkout is executed.
  agent:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.context.outputs.step == 'build' && 65 || (needs.context.outputs.step == 'sync' && 80) || 30 }}
    permissions:
      contents: read
    outputs:
      report: ${{ steps.settle.outputs.report || steps.report.outputs.report }}
      base_sha: ${{ steps.change.outputs.base_sha }}
      has_change: ${{ steps.change.outputs.has_change }}
      change_error: ${{ steps.change.outputs.change_error }}
      main_sha: ${{ steps.merge.outputs.main_sha }}
      merge_tree: ${{ steps.merge.outputs.merge_tree }}
      sync_publish: ${{ steps.settle.outputs.sync_publish }}
    steps:
      # A sync run checks out the PR head it was started on, with history, to merge the default
      # branch into it; a night launch's story build checks out its epic branch (AI-122, checked in
      # the context job), with history, to compare it with the default branch; every other step
      # starts from the default branch.
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.step == 'sync' && needs.context.outputs.head_sha || needs.context.outputs.base_branch || github.event.repository.default_branch }}
          fetch-depth: ${{ fromJSON((needs.context.outputs.step == 'sync' || needs.context.outputs.base_branch != '') && '0' || '1') }}
          persist-credentials: false

      # The profile and scripts come from the platform at the commit this workflow runs from
      # (the OIDC job_workflow_sha claim; main if absent), never from the project, so a project
      # can't swap in its own profile.
      - name: Check out the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: albernhagen/andy-intelligence
          ref: ${{ needs.context.outputs.platform_sha || 'main' }}
          path: .executor-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            platform/executor
            platform/procedures

      # AI-122: the dependency install below runs outside the sandbox and the permission profile
      # reads CODEOWNERS from the checkout, both trusting the default branch's files. An epic
      # branch whose install inputs or CODEOWNERS differ from them stops here, before the profile,
      # the install or the agent. Git alone (hooks, fsmonitor and global config off); file names
      # aren't printed (they are repo text).
      - name: Check the epic branch against the default branch
        if: needs.context.outputs.base_branch != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          main_sha=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}") || {
            echo "::error title=claude-executor::The default branch wasn't fetched."
            exit 1
          }
          drift=$(git diff --name-only -z --no-renames "$main_sha" HEAD \
            | node .executor-platform/scripts/executor-publish.mjs install-drift) || {
            echo "::error title=claude-executor::Couldn't compare the epic branch's install inputs with the default branch."
            exit 1
          }
          owners=$(git diff --name-only --no-renames "$main_sha" HEAD -- .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS | grep -c . || true)
          if [ "$drift" != "[]" ] || [ "$owners" != 0 ]; then
            echo "::error title=claude-executor::The epic branch changes install inputs or CODEOWNERS against the default branch: no install, no agent."
            exit 1
          fi
          echo "The epic branch's install inputs and CODEOWNERS match $main_sha."

      - name: Install the permission profile as managed settings
        env:
          STEP: ${{ needs.context.outputs.step }}
        run: |
          mv .executor-platform "$RUNNER_TEMP/platform"
          codeowners=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then codeowners="$GITHUB_WORKSPACE/$f"; break; fi
          done
          node "$RUNNER_TEMP/platform/scripts/executor-profile.mjs" --step "$STEP" \
            --root "$GITHUB_WORKSPACE" --codeowners "$codeowners" --out "$RUNNER_TEMP/managed-settings.json"
          # Managed settings are Claude Code's top-precedence source: the project's .claude/
          # can't loosen them. Root-owned, and the only managed source on the runner.
          sudo rm -rf /etc/claude-code
          sudo install -D -m 0644 -o root -g root "$RUNNER_TEMP/managed-settings.json" \
            /etc/claude-code/managed-settings.json
          echo "Managed settings for step $STEP (CODEOWNERS: ${codeowners:-none}):"
          cat /etc/claude-code/managed-settings.json

      # Sync only (AI-72, ADR-0083), before the agent: git alone (hooks, fsmonitor and global
      # config off), no project code. A PR head that already contains the default branch skips
      # the agent (already_current). Otherwise the merge is staged with its conflict markers and
      # committed locally (never pushed), so the agent's edits are a plain diff from it; the
      # publish job rebuilds the same merge and checks it against `merge_tree`.
      - name: Merge the default branch (sync)
        id: merge
        if: needs.context.outputs.step == 'sync'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error title=claude-executor::The checkout isn't the PR head the sync run started from."
            exit 1
          fi
          main_sha=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}") || {
            echo "::error title=claude-executor::The default branch wasn't fetched."
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$main_sha" HEAD; then
            echo "already_current=true" >> "$GITHUB_OUTPUT"
            echo "The PR head already contains $main_sha: nothing to sync."
            exit 0
          fi
          git config user.name "andy-intelligence-control[bot]"
          git config user.email "andy-intelligence-control[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "$main_sha" > /dev/null 2>&1 || true
          git rev-parse -q --verify MERGE_HEAD > /dev/null || {
            echo "::error title=claude-executor::git couldn't start the merge of the default branch."
            exit 1
          }
          git diff --name-only --diff-filter=U -z > "$RUNNER_TEMP/sync-conflicts"
          git add -A
          echo "merge_tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          git commit -q --no-verify -m "Merge the default branch (sync base, not pushed)"
          # The dependency install below runs outside the sandbox. A build installs from the
          # default branch (or an epic branch checked to match it, AI-122); a sync would install from the merged tree, whose manifests, lockfile
          # and .npmrc the PR may have changed. So a merged tree whose install inputs differ from
          # the default branch's stops here, before any install or agent (ADR-0083).
          drift=$(git diff --name-only -z --no-renames "$main_sha" HEAD \
            | node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" install-drift) || {
            echo "::error title=claude-executor::Couldn't compare the install inputs with the default branch."
            exit 1
          }
          if [ "$drift" != "[]" ]; then
            echo "install_drift=$drift" >> "$GITHUB_OUTPUT"
            echo "The merge changes install inputs against the default branch: $drift. No install, no agent."
          fi
          echo "Merged $main_sha; conflicted files: $(tr '\0' '\n' < "$RUNNER_TEMP/sync-conflicts" | grep -c .)."

      # Whether the agent edits (build, or a sync with something to merge: everything below that
      # sandboxes Bash keys on this) and whether it runs at all (an already-current sync doesn't).
      - name: Decide the agent's mode
        id: mode
        env:
          STEP: ${{ needs.context.outputs.step }}
          ALREADY_CURRENT: ${{ steps.merge.outputs.already_current }}
          INSTALL_DRIFT: ${{ steps.merge.outputs.install_drift }}
        run: |
          edits=false
          skip_agent=false
          case "$STEP" in
            build) edits=true ;;
            sync)
              if [ "$ALREADY_CURRENT" = true ] || [ -n "$INSTALL_DRIFT" ]; then
                skip_agent=true
              else
                edits=true
              fi
              ;;
          esac
          { echo "edits=$edits"; echo "skip_agent=$skip_agent"; } >> "$GITHUB_OUTPUT"
          echo "Step $STEP: edits $edits, agent skipped $skip_agent."

      # The step's procedure (platform/procedures/<step>.md, ADR-0032) and result schema
      # (<step>.schema.json) come from the platform commit too (ADR-0054). The procedure goes
      # first, so the prompt prefix is stable for caching; the run's prompt (ticket text) follows.
      # Build only: the sandbox's tools and a fail-closed check that bubblewrap can make its
      # namespaces on this runner (Ubuntu 24.04 restricts unprivileged user namespaces; this
      # AppArmor profile lifts it for bwrap alone). `failIfUnavailable` also stops Claude Code
      # if its sandbox can't start, rather than running Bash unsandboxed. This bwrap call only
      # diagnoses the runner: "Check the sandbox" below proves Claude Code's own sandbox works.
      - name: Prepare the sandbox (build)
        id: prepare
        if: steps.mode.outputs.edits == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat > /dev/null
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
              | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent --new-session true \
            || { echo "::error title=claude-executor::bubblewrap can't isolate on this runner; refusing to run Bash"; exit 1; }
          mkdir -p /tmp/agent
          # The profile write-denies the .git paths that steer git (ADR-0071). Each must exist
          # first, so the sandbox binds it read-only instead of an empty placeholder (git refuses
          # an empty commondir). "." keeps commondir pointing at .git itself.
          mkdir -p .git/refs .git/info .git/objects/info .git/modules .git/worktrees
          [ -e .git/commondir ] || printf '.\n' > .git/commondir
          [ -e .git/config.worktree ] || : > .git/config.worktree
          [ -e .git/packed-refs ] || : > .git/packed-refs
          git status --porcelain > /dev/null
          # git runs after the agent from this copy, never from the checkout's own .git.
          cp -a .git "$RUNNER_TEMP/pristine.git"
          # The files there before the agent: collection drops only new empty sandbox placeholders.
          git ls-files -z --cached --others --exclude-standard > "$RUNNER_TEMP/workspace-before.manifest"
          # The one command the sandbox check must run, unchanged (single-quoted: it expands inside
          # the sandbox). It writes facts the verify step asserts; the nonce reaches it only through
          # its environment, never the prompt.
          # shellcheck disable=SC2016
          check='git update-index -q --refresh && git status --porcelain > /dev/null && { printf "nonce=%s\npid1=%s\n" "$SANDBOX_CHECK_NONCE" "$(tr "\0" " " < /proc/1/cmdline)"; env | cut -d= -f1 | sed "s/^/env=/"; } > .executor-sandbox-check'
          { echo "nonce=$(openssl rand -hex 16)"; echo "check_command=$check"; } >> "$GITHUB_OUTPUT"
          echo "bubblewrap $(bwrap --version) can make its namespaces."

      # Build only (ADR-0071). One Bash call through Claude Code's own sandbox, under the same
      # managed settings, env and checkout the agent gets: git must write .git (update-index takes
      # index.lock), then the command writes facts (nonce, PID 1, env names) into the
      # checkout. The workflow judges: the verify step requires that exact command in the
      # execution log (one Bash call, no error, no other tool) and asserts the facts. Capped
      # (ADR-0028): Haiku, 3 turns, 5 minutes. Fixed prompt: no ticket text, no nonce.
      - name: Check the sandbox (build)
        id: sandbox_check
        if: steps.mode.outputs.edits == 'true'
        continue-on-error: true # the next step fails the job with the reason
        timeout-minutes: 5
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          TMPDIR: /tmp/agent
          SANDBOX_CHECK_NONCE: ${{ steps.prepare.outputs.nonce }}
        with:
          claude_code_oauth_token: ${{ inputs.credential == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.credential == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          allowed_bots: andy-intelligence-control
          settings: '{"disableAllHooks": true}'
          prompt: |
            This is a sandbox check. Don't read any file. Use the Bash tool exactly once to run this exact command, unchanged, and use no other tool. Then reply with its exit code and nothing else. If it fails, don't retry it or try anything else.

            ${{ steps.prepare.outputs.check_command }}
          claude_args: |
            --model haiku
            --max-turns 3

      - name: Verify the sandbox check (build)
        id: sandbox_verify
        if: always() && steps.mode.outputs.edits == 'true' && steps.prepare.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.sandbox_check.outputs.execution_file }}
          COMMAND: ${{ steps.prepare.outputs.check_command }}
          NONCE: ${{ steps.prepare.outputs.nonce }}
          CHECK_OUTCOME: ${{ steps.sandbox_check.outcome }}
        run: |
          # Whatever the check did, the checkout gets the pristine .git back first; a changed path
          # that steers git fails the job.
          tampered=$(PRISTINE="$RUNNER_TEMP/pristine.git" LIVE="$GITHUB_WORKSPACE/.git" \
            node "$RUNNER_TEMP/platform/scripts/executor-sandbox.mjs" check-git) || tampered="(check failed)"
          rm -rf "$GITHUB_WORKSPACE/.git"
          cp -a "$RUNNER_TEMP/pristine.git" "$GITHUB_WORKSPACE/.git"
          if [ -n "$tampered" ]; then
            echo "::error title=claude-executor::The sandbox check changed .git: $(tr '\n' ' ' <<<"$tampered")"
            exit 1
          fi
          if ! MARKER="$GITHUB_WORKSPACE/.executor-sandbox-check" \
            node "$RUNNER_TEMP/platform/scripts/executor-sandbox.mjs" verify-check; then
            echo "::error title=claude-executor::Sandbox check failed (check step: $CHECK_OUTCOME): the exact check command didn't run cleanly in Claude Code's sandbox, or its facts (nonce, PID 1, env names) didn't show one. Refusing to run the agent; see runbook agent-runs.md §9."
            exit 1
          fi
          # The sandbox leaves its empty placeholders behind even after a normal exit (AI-50): drop
          # those (listed, empty, regular, new since the manifest; each logged), then the agent
          # starts from a clean checkout: anything else the check left fails here with its name.
          # git runs from the pre-agent copy of .git.
          WORKSPACE="$GITHUB_WORKSPACE" MANIFEST="$RUNNER_TEMP/workspace-before.manifest" \
            node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" drop-placeholders || exit 1
          dirty=$(GIT_DIR="$RUNNER_TEMP/pristine.git" GIT_WORK_TREE="$GITHUB_WORKSPACE" GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
            status --porcelain --untracked-files=all) || dirty="(git status failed)"
          if [ -n "$dirty" ]; then
            echo "::error title=claude-executor::The sandbox check left the checkout changed: $(cut -c4- <<<"$dirty" | head -n 20 | tr '\n' ' ')"
            exit 1
          fi
          echo "Sandbox ready: one sandboxed Bash call wrote .git and the checkout, in its own PID namespace, with no credential variables."

      # The project's toolchain, from the platform's pinned actions (not the project's code).
      # pnpm goes to the tool cache, not ~/setup-pnpm: the sandbox can't read /home
      # (blockReadsOutsideWorkingDirectories) and can't write the tool cache (AI-51).
      - name: Set up pnpm (build)
        if: steps.mode.outputs.edits == 'true' && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - name: Set up Node (build)
        if: steps.mode.outputs.edits == 'true' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Build only (ADR-0072). Inside the sandbox node_modules and its .bin are read-only binds
      # (Claude Code's own protected package-manager paths), so dependencies are installed here,
      # outside the sandbox, before the agent: from the lockfile of the commit the agent starts
      # from (the default branch, or an epic branch with the same install inputs, AI-122), with lifecycle scripts and .pnpmfile.cjs hooks off, so no package
      # or project code runs in this job (pnpm still reads the repo's .npmrc and workspace settings).
      # The store is under runner temp, which sandboxed commands can't read, so the agent can't
      # alter the files behind node_modules' hardlinks. A failed install fails the job.
      - name: Install dependencies (build)
        if: steps.mode.outputs.edits == 'true' && hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --store-dir "$RUNNER_TEMP/pnpm-store"

      - name: Load the step's procedure and result schema
        id: procedure
        if: steps.mode.outputs.skip_agent != 'true'
        env:
          STEP: ${{ needs.context.outputs.step }}
          RUN_PROMPT: ${{ needs.context.outputs.prompt }}
          PROCEDURES_DIR: ${{ runner.temp }}/platform/platform/procedures
          SYNC_CONFLICTS_FILE: ${{ runner.temp }}/sync-conflicts
        run: node "$RUNNER_TEMP/platform/scripts/executor-procedure.mjs"

      - name: Claude Code
        id: claude
        if: steps.mode.outputs.skip_agent != 'true'
        continue-on-error: true # a failed agent is reported as a failed run, not a crashed job
        timeout-minutes: ${{ needs.context.outputs.step == 'build' && 55 || (needs.context.outputs.step == 'sync' && 40) || 25 }}
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          # Build and sync: strip credentials from every subprocess and give Bash its own PID
          # namespace, so `cat /proc/<pid>/environ` can't reach the model credential (ADR-0063).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ steps.mode.outputs.edits == 'true' && '1' || '0' }}
          # Inside the sandbox's writable paths (profile: filesystem.allowWrite).
          TMPDIR: ${{ steps.mode.outputs.edits == 'true' && '/tmp/agent' || '' }}
          npm_config_store_dir: ${{ steps.mode.outputs.edits == 'true' && '/tmp/agent/pnpm-store' || '' }}
          # pnpm's cache and state default to ~/.cache and ~/.local/state, unreadable in the sandbox.
          npm_config_cache_dir: ${{ steps.mode.outputs.edits == 'true' && '/tmp/agent/pnpm-cache' || '' }}
          npm_config_state_dir: ${{ steps.mode.outputs.edits == 'true' && '/tmp/agent/pnpm-state' || '' }}
        with:
          claude_code_oauth_token: ${{ inputs.credential == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.credential == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # The control plane's GitHub App starts every run, so the action's "human actor" check
          # must allow that one bot by name (`[bot]` suffix optional). Never '*': on a public repo
          # any App could then start runs. Update if the App is renamed (runbook agent-runs.md).
          allowed_bots: andy-intelligence-control
          settings: '{"disableAllHooks": true}'
          prompt: ${{ steps.procedure.outputs.prompt }}
          # model and max_turns were validated in `context`. The managed profile already holds
          # the step's allow/deny rules (allowManagedPermissionRulesOnly ignores --allowedTools);
          # the flags repeat them for read-only steps as a second layer. With a schema, the run
          # must end in structured output matching it (the report sends it as `output`).
          claude_args: |
            --model ${{ needs.context.outputs.model }}
            --max-turns ${{ needs.context.outputs.max_turns }}
            ${{ steps.procedure.outputs.schema_args }}
            ${{ needs.context.outputs.read_only == 'true' && '--allowedTools "Read,Glob,Grep" --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"' || '' }}

      # Build only. The checkout is hostile now: git reads the copy of .git taken before the agent
      # (no hooks, fsmonitor or filters the agent could plant), and the change leaves as a patch.
      - name: Collect the change (build)
        id: change
        if: always() && steps.mode.outputs.edits == 'true' && steps.claude.outcome != 'skipped'
        env:
          MAX_PATCH_BYTES: 5242880
        run: |
          export GIT_DIR="$RUNNER_TEMP/pristine.git" GIT_WORK_TREE="$GITHUB_WORKSPACE"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git() { command git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c core.untrackedCache=false "$@"; }
          # A change that can't be collected or is over the cap fails the run with the reason
          # (the report job reads change_error), never reads as "no change".
          fail() {
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            echo "change_error=$1" >> "$GITHUB_OUTPUT"
            echo "::error title=claude-executor::$1"
            exit 0
          }
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/change"
          # The agent could write .git (ADR-0071). A change to a path that steers git (config,
          # hooks, commondir, info, alternates, ...) fails the run; either way the checkout gets
          # the pristine .git back before anything else (checkout's post step) runs git there.
          tampered=$(PRISTINE="$GIT_DIR" LIVE="$GITHUB_WORKSPACE/.git" \
            node "$RUNNER_TEMP/platform/scripts/executor-sandbox.mjs" check-git) || tampered="(check failed)"
          if ! { rm -rf "$GITHUB_WORKSPACE/.git" && cp -a "$GIT_DIR" "$GITHUB_WORKSPACE/.git"; }; then
            fail "Couldn't restore the checkout's .git after the agent."
          fi
          [ -z "$tampered" ] || fail "The agent changed .git: $(tr '\n' ' ' <<<"$tampered")(refusing to publish)."
          # Empty files the sandbox left at its protected paths are not the agent's change (AI-42).
          WORKSPACE="$GITHUB_WORKSPACE" MANIFEST="$RUNNER_TEMP/workspace-before.manifest" \
            node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" drop-placeholders \
            || fail "Couldn't collect the change (dropping sandbox placeholders failed)."
          git add -A || fail "Couldn't collect the change (git add failed)."
          git diff --cached --binary --no-ext-diff --no-textconv --no-renames > "$RUNNER_TEMP/change/change.patch" \
            || fail "Couldn't collect the change (git diff failed)."
          size=$(stat -c %s "$RUNNER_TEMP/change/change.patch")
          if [ "$size" -eq 0 ]; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"; echo "No change."
          elif [ "$size" -gt "$MAX_PATCH_BYTES" ]; then
            fail "The change is $size bytes; the cap is $MAX_PATCH_BYTES (a missing .gitignore entry, e.g. node_modules?)."
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat --no-ext-diff | tail -n 30
          fi

      - name: Upload the change (build)
        if: always() && steps.change.outputs.has_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-${{ inputs.run_id }}
          path: ${{ runner.temp }}/change/change.patch
          retention-days: 7
          if-no-files-found: error

      - name: Build the run report
        id: report
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REASON: ${{ steps.sandbox_verify.outcome == 'failure' && 'The sandbox check failed, so the agent did not run (a sandboxed Bash call could not write the checkout and .git with credentials unset)' || (steps.claude.outcome == 'skipped' && 'Executor setup failed before the agent ran' || '') }}
          STEP: ${{ needs.context.outputs.step }}
          ALREADY_CURRENT: ${{ steps.merge.outputs.already_current }}
          INSTALL_DRIFT: ${{ steps.merge.outputs.install_drift }}
        run: |
          if [ "$ALREADY_CURRENT" = true ]; then
            report=$(jq -cn '{status: "succeeded", summary: "The PR already contained the default branch.", alreadyCurrent: true, tokensIn: null, tokensOut: null, costUsd: null}')
          elif [ -n "$INSTALL_DRIFT" ]; then
            # The executor's own verdict, not the agent's: no install or agent ran.
            report=$(jq -cn '(env.INSTALL_DRIFT | try fromjson catch [] | map(tostring) | .[:50]) as $files | {status: "succeeded", summary: "The PR changes dependency or toolchain files, so the sync run did not install or run anything.", tokensIn: null, tokensOut: null, costUsd: null, output: {outcome: "checks_failed", summary: "The PR changes dependency or toolchain files; a sync run installs only what the default branch has.", conflictFiles: $files, reason: "The PR changes dependency or toolchain files against main; a sync run never installs from files a PR changed. Merge main into it by hand.", verification: []}}')
          else
            report=$(node "$RUNNER_TEMP/platform/scripts/executor-report.mjs")
          fi
          echo "status: $(jq -r .status <<<"$report")"
          # Sync: an agent that says it synced only earns the executor's own run of the checks.
          if [ "$STEP" = sync ] && jq -e '.status == "succeeded" and .output.outcome == "synced"' <<<"$report" > /dev/null 2>&1; then
            echo "agent_synced=true" >> "$GITHUB_OUTPUT"
          fi
          delimiter="REPORT_$(openssl rand -hex 16)"
          printf 'report<<%s\n%s\n%s\n' "$delimiter" "$report" "$delimiter" >> "$GITHUB_OUTPUT"

      # Sync only (AI-72, ADR-0083): the agent's word that the checks pass isn't enough to push.
      # The executor runs them itself, as the sandbox check runs its command: one fixed command
      # through Claude Code's sandbox (same managed settings, scrub and env as the agent; Haiku,
      # 3 turns), judged from the execution log (that exact command, one Bash call, no error) and a
      # marker only the command's success writes, holding a nonce the agent never saw. Every
      # package script it runs stays inside the sandbox; only this verdict publishes.
      - name: Prepare the checks (sync)
        id: checks_prepare
        if: steps.report.outputs.agent_synced == 'true' && steps.change.outputs.change_error == ''
        run: |
          rm -f /tmp/agent/sync-checks-passed
          # shellcheck disable=SC2016
          command='pnpm run --if-present lint && pnpm run --if-present typecheck && pnpm run --if-present test && pnpm run --if-present build && printf "nonce=%s\n" "$SYNC_CHECKS_NONCE" > /tmp/agent/sync-checks-passed'
          { echo "nonce=$(openssl rand -hex 16)"; echo "command=$command"; } >> "$GITHUB_OUTPUT"

      - name: Run the checks (sync)
        id: sync_checks
        if: steps.checks_prepare.outcome == 'success'
        continue-on-error: true # the verify step judges it
        timeout-minutes: 30
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          TMPDIR: /tmp/agent
          npm_config_store_dir: /tmp/agent/pnpm-store
          npm_config_cache_dir: /tmp/agent/pnpm-cache
          npm_config_state_dir: /tmp/agent/pnpm-state
          # The checks take minutes; Bash's default 2-minute timeout would cut them off.
          BASH_DEFAULT_TIMEOUT_MS: "1500000"
          BASH_MAX_TIMEOUT_MS: "1500000"
          SYNC_CHECKS_NONCE: ${{ steps.checks_prepare.outputs.nonce }}
        with:
          claude_code_oauth_token: ${{ inputs.credential == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.credential == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          allowed_bots: andy-intelligence-control
          settings: '{"disableAllHooks": true}'
          prompt: |
            This is a check run. Don't read any file. Use the Bash tool exactly once to run this exact command, unchanged, and use no other tool. Then reply with its exit code and nothing else. If it fails, don't retry it or try anything else.

            ${{ steps.checks_prepare.outputs.command }}
          claude_args: |
            --model haiku
            --max-turns 3

      - name: Verify the checks (sync)
        id: checks_verify
        if: always() && steps.checks_prepare.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.sync_checks.outputs.execution_file }}
          COMMAND: ${{ steps.checks_prepare.outputs.command }}
          NONCE: ${{ steps.checks_prepare.outputs.nonce }}
        run: |
          # The run could write .git, like the agent: the pristine copy goes back, and a changed
          # path that steers git fails the checks.
          tampered=$(PRISTINE="$RUNNER_TEMP/pristine.git" LIVE="$GITHUB_WORKSPACE/.git" \
            node "$RUNNER_TEMP/platform/scripts/executor-sandbox.mjs" check-git) || tampered="(check failed)"
          rm -rf "$GITHUB_WORKSPACE/.git"
          cp -a "$RUNNER_TEMP/pristine.git" "$GITHUB_WORKSPACE/.git"
          if [ -n "$tampered" ]; then
            echo "problem=the check run changed .git: $(tr '\n' ' ' <<<"$tampered")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if problem=$(MARKER=/tmp/agent/sync-checks-passed \
            node "$RUNNER_TEMP/platform/scripts/executor-sandbox.mjs" verify-checks); then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "The project's checks passed in the sandbox."
          else
            echo "problem=$(tr '\n' ' ' <<<"$problem" | cut -c1-300)" >> "$GITHUB_OUTPUT"
            echo "::warning title=claude-executor::The executor's run of the checks failed: $problem"
          fi

      # Sync only: publish when the agent synced and the executor's checks passed; an agent that
      # said synced but whose checks failed becomes checks_failed (Needs-you, no push).
      - name: Settle the sync result (sync)
        id: settle
        if: always() && needs.context.outputs.step == 'sync' && steps.report.outcome == 'success'
        env:
          REPORT: ${{ steps.report.outputs.report }}
          AGENT_SYNCED: ${{ steps.report.outputs.agent_synced }}
          CHECKS_PASSED: ${{ steps.checks_verify.outputs.passed }}
          CHECKS_PROBLEM: ${{ steps.checks_verify.outputs.problem || 'the checks did not run' }}
        run: |
          report="$REPORT"
          if [ "$AGENT_SYNCED" = true ] && [ "$CHECKS_PASSED" = true ]; then
            echo "sync_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$AGENT_SYNCED" = true ]; then
            report=$(jq -c '.output.outcome = "checks_failed" | .output.reason = ("The executor ran the project'"'"'s checks after the agent and they did not pass (" + env.CHECKS_PROBLEM + "); nothing was pushed.")' <<<"$REPORT")
          fi
          delimiter="REPORT_$(openssl rand -hex 16)"
          printf 'report<<%s\n%s\n%s\n' "$delimiter" "$report" "$delimiter" >> "$GITHUB_OUTPUT"

  # Build only. Holds the one App repo token of this run (contents + pull requests write, 1 hour,
  # from POST /github/token: the control plane gives one per build run, ADR-0063). It runs no code
  # from the change: it checks the patch's paths, applies it to the commit the agent started from,
  # commits, pushes `agent/<KEY>/<run>` and, if the agent succeeded, opens the PR. A failed agent's
  # partial work is still pushed (no PR) so Andy can inspect it.
  # Sync (AI-72, ADR-0083): the same job and token rule; it checks out the PR head instead, rebuilds
  # the merge, proves it is the tree the agent started from, applies only the agent's edits (the
  # same path checks), refuses leftover conflict markers and pushes the merge as a fast forward.
  publish:
    needs: [context, agent]
    if: >-
      always() && (
        (needs.context.outputs.step == 'build' && needs.agent.outputs.has_change == 'true') ||
        (needs.context.outputs.step == 'sync' && needs.agent.outputs.sync_publish == 'true' && needs.agent.outputs.change_error == '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout; the push uses the App token
      id-token: write # Actions OIDC token for POST /github/token
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      pull_request: ${{ steps.push.outputs.pull_request }}
      tooling_files: ${{ steps.push.outputs.tooling_files || steps.sync.outputs.tooling_files }}
      head_sha: ${{ steps.sync.outputs.head_sha }}
    steps:
      - name: Check out the agent's base commit (the PR head with history for sync)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.step == 'sync' && needs.context.outputs.head_sha || needs.agent.outputs.base_sha }}
          fetch-depth: ${{ fromJSON(needs.context.outputs.step == 'sync' && '0' || '1') }}
          persist-credentials: false

      - name: Check out the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: albernhagen/andy-intelligence
          ref: ${{ needs.context.outputs.platform_sha || 'main' }}
          path: .executor-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            platform/executor

      - name: Download the change
        if: needs.agent.outputs.has_change == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: change-${{ inputs.run_id }}
          path: ${{ runner.temp }}/change

      # Thin caller: scripts/executor-publish.mjs from the platform checkout (at platform_sha, a
      # separate directory the agent never wrote) does apply, check, commit, token, push and PR.
      # Safety (holds a write token): the project checkout is the agent's base commit, the
      # change is applied as data and checked, and nothing from it runs here. The script passes
      # agent text only as arguments, files or JSON bodies, never through a shell, and never
      # prints the token, the report or the title. Keep `set -x` out of this step.
      - name: Publish the change
        id: push
        if: needs.context.outputs.step == 'build'
        env:
          PATCH: ${{ runner.temp }}/change/change.patch
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ needs.context.outputs.branch }}
          REPO: ${{ github.repository }}
          BASE: ${{ needs.context.outputs.base_branch || github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_ID: ${{ needs.context.outputs.project_id }}
          TICKET_KEY: ${{ needs.context.outputs.ticket_key }}
          TICKET_TITLE: ${{ needs.context.outputs.ticket_title }}
          MODEL: ${{ needs.context.outputs.model }}
          REPORT: ${{ needs.agent.outputs.report }}
        run: |
          mv .executor-platform "$RUNNER_TEMP/platform"
          codeowners=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then codeowners="$f"; break; fi
          done
          PROFILE="$RUNNER_TEMP/platform/platform/executor/profile.json" CODEOWNERS="$codeowners" \
            node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" publish

      # Same safety as above: git and the token only, nothing from the change runs; the merge
      # commit has the PR head and the default branch commit as parents and is never forced.
      - name: Publish the merge (sync)
        id: sync
        if: needs.context.outputs.step == 'sync'
        env:
          PATCH: ${{ needs.agent.outputs.has_change == 'true' && format('{0}/change/change.patch', runner.temp) || '' }}
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ needs.context.outputs.branch }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          MAIN_SHA: ${{ needs.agent.outputs.main_sha }}
          MERGE_TREE: ${{ needs.agent.outputs.merge_tree }}
        run: |
          mv .executor-platform "$RUNNER_TEMP/platform"
          codeowners=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then codeowners="$f"; break; fi
          done
          PROFILE="$RUNNER_TEMP/platform/platform/executor/profile.json" CODEOWNERS="$codeowners" \
            node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" sync

  report:
    needs: [context, agent, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Actions OIDC token for POST /runs/{id}/report
    steps:
      - name: Report to the control plane
        env:
          RUN_ID: ${{ inputs.run_id }}
          REPORT: ${{ needs.agent.outputs.report }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          CONTEXT_ERROR: ${{ needs.context.outputs.error }}
          AGENT_RESULT: ${{ needs.agent.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CHANGE_ERROR: ${{ needs.agent.outputs.change_error }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          PULL_REQUEST: ${{ needs.publish.outputs.pull_request }}
          TOOLING_FILES: ${{ needs.publish.outputs.tooling_files }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]; then
            echo "::error title=claude-executor::Invalid run_id; nothing to report to."
            exit 1
          fi
          body="$RUNNER_TEMP/report.json"
          if [ -n "$REPORT" ] && jq -e 'type == "object" and (.status == "succeeded" or .status == "failed")' <<<"$REPORT" > /dev/null 2>&1; then
            printf '%s' "$REPORT" > "$body"
          else
            if [ "$CONTEXT_RESULT" != success ]; then
              reason="Executor could not start: ${CONTEXT_ERROR:-context job $CONTEXT_RESULT}"
            else
              reason="Executor agent job $AGENT_RESULT before it built a report"
            fi
            jq -cn --arg s "$reason" '{status: "failed", summary: $s, tokensIn: null, tokensOut: null, costUsd: null}' > "$body"
          fi
          # Build: the publish job's branch and PR go with the report; a publish that failed after
          # a successful agent fails the run (the control plane retries it once). Sync: the branch
          # and the merge commit pushed (headSha).
          if [ -n "$CHANGE_ERROR" ]; then
            jq -c '.status = "failed" | .summary = (env.CHANGE_ERROR + "\n\n" + (.summary // ""))' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          elif [ "$PUBLISH_RESULT" = failure ] || [ "$PUBLISH_RESULT" = cancelled ]; then
            jq -c '.status = "failed" | .summary = ("The publish job " + env.PUBLISH_RESULT + ": the change was not pushed or no PR was opened.\n\n" + (.summary // ""))' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          fi
          jq -c '. + {branch: (if env.BRANCH == "" then null else env.BRANCH end), pullRequest: (if env.PULL_REQUEST == "" then null else env.PULL_REQUEST end), toolingFiles: ((env.TOOLING_FILES | try fromjson catch []) // [] | if type == "array" then .[:50] else [] end), headSha: (if env.HEAD_SHA == "" then null else env.HEAD_SHA end)}' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          echo "Reporting status: $(jq -r .status "$body")"

          response="$RUNNER_TEMP/report-response.txt"
          for attempt in 1 2 3; do
            code=000
            if oidc=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE_URL" | jq -r .value) && [ -n "$oidc" ] && [ "$oidc" != null ]; then
              echo "::add-mask::$oidc"
              code=$(curl -sS --max-time 30 -o "$response" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
                --data-binary "@$body" "$CONTROL_PLANE_URL/runs/$RUN_ID/report") || code=000
            fi
            case "$code" in
              2??)
                echo "Reported run $RUN_ID (HTTP $code)."
                exit 0
                ;;
              000 | 5??)
                echo "::warning title=claude-executor::Report attempt $attempt failed (HTTP $code)."
                [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
                ;;
              *)
                echo "::error title=claude-executor::Control plane rejected the report: HTTP $code: $(head -c 300 "$response" | tr -d '\r\n')"
                exit 1
                ;;
            esac
          done
          echo "::error title=claude-executor::Could not report run $RUN_ID after 3 attempts."
          exit 1
