name: Claude Code executor

# The platform's Claude Code executor (ARCHITECTURE §7.2, M1.6: Claude Code executor). A project's
# agent-run.yml calls it with a run ID; it fetches the run's prompt from the control plane, runs
# claude-code-action under the executor permission profile (ADR-0040) and reports the result back.
# The control plane accepts the callbacks only from this file on main: it checks the Actions OIDC
# token's `job_workflow_ref` (ADR-0019: Agent callbacks authenticated with GitHub Actions OIDC).
#
# Separate jobs so the agent's job never holds an OIDC token or a write token (as ADR-0043 does
# for the system review): `context` and `report` talk to the control plane; `agent` only has the
# model credential and a read-only repo token, and never runs before the profile is installed;
# for build runs (ADR-0063) `publish` checks the agent's change, pushes it with a 1-hour App
# token and opens the PR, running none of the change's code.
# The prompt is ticket text: untrusted data. It travels in env, job outputs and the action's
# `prompt` input, never inside a `run:` script. So do the ticket title and the agent's output.

on:
  workflow_call:
    inputs:
      run_id:
        description: "Control-plane run ID (not secret)"
        type: string
        required: true
      credential:
        description: "Model credential: subscription (CLAUDE_CODE_OAUTH_TOKEN) or api_key (ANTHROPIC_API_KEY)"
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions: {}

env:
  # The control plane's public URL (also the OIDC audience). Not secret.
  CONTROL_PLANE_URL: https://ai.andybernhagen.com

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Actions OIDC token for GET /runs/{id}/context
    outputs:
      step: ${{ steps.context.outputs.step }}
      model: ${{ steps.context.outputs.model }}
      max_turns: ${{ steps.context.outputs.max_turns }}
      read_only: ${{ steps.context.outputs.read_only }}
      prompt: ${{ steps.context.outputs.prompt }}
      ticket_key: ${{ steps.context.outputs.ticket_key }}
      ticket_title: ${{ steps.context.outputs.ticket_title }}
      project_id: ${{ steps.context.outputs.project_id }}
      branch: ${{ steps.context.outputs.branch }}
      platform_sha: ${{ steps.context.outputs.platform_sha }}
      error: ${{ steps.context.outputs.error }}
    steps:
      - name: Validate inputs and fetch the run context
        id: context
        env:
          RUN_ID: ${{ inputs.run_id }}
          CREDENTIAL: ${{ inputs.credential }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MAX_TURNS_CAP: 200 # spend cap per run (ADR-0028), whatever the control plane asks
          MAX_PROMPT_CHARS: 200000
        run: |
          fail() {
            echo "error=$1" >> "$GITHUB_OUTPUT"
            echo "::error title=claude-executor::$1"
            exit 1
          }
          [[ "$RUN_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]] || fail "run_id must be 1-64 letters, digits or hyphens"
          case "$CREDENTIAL" in
            subscription) [ "$HAS_OAUTH_TOKEN" = true ] || fail "credential=subscription but secret CLAUDE_CODE_OAUTH_TOKEN is empty" ;;
            api_key) [ "$HAS_API_KEY" = true ] || fail "credential=api_key but secret ANTHROPIC_API_KEY is empty" ;;
            *) fail "credential must be subscription or api_key" ;;
          esac

          oidc=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE_URL" | jq -r .value) || fail "could not get an Actions OIDC token"
          echo "::add-mask::$oidc"
          # The commit this reusable workflow runs from, from the token's job_workflow_sha claim
          # (actionlint doesn't know job.workflow_sha yet). The agent job checks the platform out there.
          payload=$(cut -d. -f2 <<<"$oidc" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          platform_sha=$(base64 -d <<<"$payload" | jq -r '.job_workflow_sha // empty') || platform_sha=""
          [[ "$platform_sha" =~ ^[0-9a-f]{40}$ ]] || platform_sha=""

          body="$RUNNER_TEMP/context.json"
          code=$(curl -sS --retry 2 --max-time 30 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $oidc" "$CONTROL_PLANE_URL/runs/$RUN_ID/context") || code=000
          if [ "$code" != 200 ]; then
            fail "GET /runs/$RUN_ID/context returned HTTP $code: $(head -c 300 "$body" 2>/dev/null | tr -d '\r\n')"
          fi
          jq -e --arg id "$RUN_ID" --argjson cap "$MAX_TURNS_CAP" --argjson max "$MAX_PROMPT_CHARS" '
            (.runId == $id)
            and (.step | type == "string" and test("^[a-z][a-z-]{0,31}$"))
            and (.model | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"))
            and (.maxTurns | type == "number" and . == floor and . >= 1 and . <= $cap)
            and (.prompt | type == "string" and length > 0 and length <= $max)
            and (.step != "build" or (
              (.ticket.key | type == "string" and test("^[A-Z][A-Z0-9]{0,9}-[0-9]{1,9}$"))
              and (.ticket.projectId | type == "string" and test("^[a-z][a-z0-9]{0,9}$"))
              and (.ticket.title | type == "string" and length > 0 and length <= 500)
              and (.branch == "agent/\(.ticket.key)/\($id)")))
          ' "$body" > /dev/null || fail "GET /runs/$RUN_ID/context: unexpected response shape"

          step=$(jq -r .step "$body")
          case "$step" in refine | plan | review) read_only=true ;; *) read_only=false ;; esac
          {
            echo "step=$step"
            echo "model=$(jq -r .model "$body")"
            echo "max_turns=$(jq -r .maxTurns "$body")"
            echo "read_only=$read_only"
            echo "platform_sha=$platform_sha"
            echo "ticket_key=$(jq -r '.ticket.key // ""' "$body")"
            echo "project_id=$(jq -r '.ticket.projectId // ""' "$body")"
            echo "branch=$(jq -r '.branch // ""' "$body")"
            # One line: the title can't hold a newline here, and the delimiter is random.
            echo "ticket_title=$(jq -r '.ticket.title // "" | gsub("[\\r\\n]+"; " ")' "$body")"
            delimiter="PROMPT_$(openssl rand -hex 16)"
            echo "prompt<<$delimiter"
            jq -r .prompt "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          rm -f "$body"
          echo "Run $RUN_ID: step $step, read-only $read_only."

  # Holds the model credential. The project is checked out from its default branch (not a PR).
  # Read-only steps only read it. A build run's agent edits it and runs its commands, but only
  # through Bash inside Claude Code's sandbox (ADR-0063): credentials unset and scrubbed, its own
  # PID namespace, writes limited to the checkout, network to the package registry only. The
  # job's own steps after the agent treat the checkout as hostile: git runs from a copy of .git
  # taken before the agent started, and nothing from the checkout is executed.
  agent:
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.context.outputs.step == 'build' && 65 || 30 }}
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
      base_sha: ${{ steps.change.outputs.base_sha }}
      has_change: ${{ steps.change.outputs.has_change }}
      change_error: ${{ steps.change.outputs.change_error }}
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The profile and scripts come from the platform at the commit this workflow runs from
      # (the OIDC job_workflow_sha claim; main if absent), never from the project, so a project
      # can't swap in its own profile.
      - name: Check out the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: albernhagen/andy-intelligence
          ref: ${{ needs.context.outputs.platform_sha || 'main' }}
          path: .executor-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            platform/executor
            platform/procedures

      - name: Install the permission profile as managed settings
        env:
          STEP: ${{ needs.context.outputs.step }}
        run: |
          mv .executor-platform "$RUNNER_TEMP/platform"
          codeowners=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then codeowners="$GITHUB_WORKSPACE/$f"; break; fi
          done
          node "$RUNNER_TEMP/platform/scripts/executor-profile.mjs" --step "$STEP" \
            --root "$GITHUB_WORKSPACE" --codeowners "$codeowners" --out "$RUNNER_TEMP/managed-settings.json"
          # Managed settings are Claude Code's top-precedence source: the project's .claude/
          # can't loosen them. Root-owned, and the only managed source on the runner.
          sudo rm -rf /etc/claude-code
          sudo install -D -m 0644 -o root -g root "$RUNNER_TEMP/managed-settings.json" \
            /etc/claude-code/managed-settings.json
          echo "Managed settings for step $STEP (CODEOWNERS: ${codeowners:-none}):"
          cat /etc/claude-code/managed-settings.json

      # The step's procedure (platform/procedures/<step>.md, ADR-0032) and result schema
      # (<step>.schema.json) come from the platform commit too (ADR-0054). The procedure goes
      # first, so the prompt prefix is stable for caching; the run's prompt (ticket text) follows.
      # Build only: the sandbox's tools and a fail-closed check that bubblewrap can make its
      # namespaces on this runner (Ubuntu 24.04 restricts unprivileged user namespaces; this
      # AppArmor profile lifts it for bwrap alone). `failIfUnavailable` also stops Claude Code
      # if its sandbox can't start, rather than running Bash unsandboxed.
      - name: Prepare the sandbox (build)
        if: needs.context.outputs.step == 'build'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat > /dev/null
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
              | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent --new-session true \
            || { echo "::error title=claude-executor::bubblewrap can't isolate on this runner; refusing to run Bash"; exit 1; }
          mkdir -p /tmp/agent
          # git runs after the agent from this copy, never from the checkout's own .git.
          cp -a .git "$RUNNER_TEMP/pristine.git"
          echo "Sandbox ready: bubblewrap $(bwrap --version)."

      # The project's toolchain, from the platform's pinned actions (not the project's code).
      - name: Set up pnpm (build)
        if: needs.context.outputs.step == 'build' && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node (build)
        if: needs.context.outputs.step == 'build' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Load the step's procedure and result schema
        id: procedure
        env:
          STEP: ${{ needs.context.outputs.step }}
          RUN_PROMPT: ${{ needs.context.outputs.prompt }}
          PROCEDURES_DIR: ${{ runner.temp }}/platform/platform/procedures
        run: node "$RUNNER_TEMP/platform/scripts/executor-procedure.mjs"

      - name: Claude Code
        id: claude
        continue-on-error: true # a failed agent is reported as a failed run, not a crashed job
        timeout-minutes: ${{ needs.context.outputs.step == 'build' && 55 || 25 }}
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          # Build: strip credentials from every subprocess and give Bash its own PID namespace,
          # so `cat /proc/<pid>/environ` can't reach the model credential (ADR-0063).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ needs.context.outputs.step == 'build' && '1' || '0' }}
          # Inside the sandbox's writable paths (profile: filesystem.allowWrite).
          TMPDIR: ${{ needs.context.outputs.step == 'build' && '/tmp/agent' || '' }}
          npm_config_store_dir: ${{ needs.context.outputs.step == 'build' && '/tmp/agent/pnpm-store' || '' }}
        with:
          claude_code_oauth_token: ${{ inputs.credential == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ inputs.credential == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # The control plane's GitHub App starts every run, so the action's "human actor" check
          # must allow that one bot by name (`[bot]` suffix optional). Never '*': on a public repo
          # any App could then start runs. Update if the App is renamed (runbook agent-runs.md).
          allowed_bots: andy-intelligence-control
          settings: '{"disableAllHooks": true}'
          prompt: ${{ steps.procedure.outputs.prompt }}
          # model and max_turns were validated in `context`. The managed profile already holds
          # the step's allow/deny rules (allowManagedPermissionRulesOnly ignores --allowedTools);
          # the flags repeat them for read-only steps as a second layer. With a schema, the run
          # must end in structured output matching it (the report sends it as `output`).
          claude_args: |
            --model ${{ needs.context.outputs.model }}
            --max-turns ${{ needs.context.outputs.max_turns }}
            ${{ steps.procedure.outputs.schema_args }}
            ${{ needs.context.outputs.read_only == 'true' && '--allowedTools "Read,Glob,Grep" --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"' || '' }}

      # Build only. The checkout is hostile now: git reads the copy of .git taken before the agent
      # (no hooks, fsmonitor or filters the agent could plant), and the change leaves as a patch.
      - name: Collect the change (build)
        id: change
        if: always() && needs.context.outputs.step == 'build' && steps.claude.outcome != 'skipped'
        env:
          MAX_PATCH_BYTES: 5242880
        run: |
          export GIT_DIR="$RUNNER_TEMP/pristine.git" GIT_WORK_TREE="$GITHUB_WORKSPACE"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git() { command git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c core.untrackedCache=false "$@"; }
          # A change that can't be collected or is over the cap fails the run with the reason
          # (the report job reads change_error), never reads as "no change".
          fail() {
            echo "has_change=false" >> "$GITHUB_OUTPUT"
            echo "change_error=$1" >> "$GITHUB_OUTPUT"
            echo "::error title=claude-executor::$1"
            exit 0
          }
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/change"
          git add -A || fail "Couldn't collect the change (git add failed)."
          git diff --cached --binary --no-ext-diff --no-textconv --no-renames > "$RUNNER_TEMP/change/change.patch" \
            || fail "Couldn't collect the change (git diff failed)."
          size=$(stat -c %s "$RUNNER_TEMP/change/change.patch")
          if [ "$size" -eq 0 ]; then
            echo "has_change=false" >> "$GITHUB_OUTPUT"; echo "No change."
          elif [ "$size" -gt "$MAX_PATCH_BYTES" ]; then
            fail "The change is $size bytes; the cap is $MAX_PATCH_BYTES (a missing .gitignore entry, e.g. node_modules?)."
          else
            echo "has_change=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat --no-ext-diff | tail -n 30
          fi

      - name: Upload the change (build)
        if: always() && steps.change.outputs.has_change == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-${{ inputs.run_id }}
          path: ${{ runner.temp }}/change/change.patch
          retention-days: 7
          if-no-files-found: error

      - name: Build the run report
        id: report
        if: always()
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          REASON: ${{ steps.claude.outcome == 'skipped' && 'Executor setup failed before the agent ran' || '' }}
        run: |
          report=$(node "$RUNNER_TEMP/platform/scripts/executor-report.mjs")
          echo "status: $(jq -r .status <<<"$report")"
          delimiter="REPORT_$(openssl rand -hex 16)"
          printf 'report<<%s\n%s\n%s\n' "$delimiter" "$report" "$delimiter" >> "$GITHUB_OUTPUT"

  # Build only. Holds the one App repo token of this run (contents + pull requests write, 1 hour,
  # from POST /github/token: the control plane gives one per build run, ADR-0063). It runs no code
  # from the change: it checks the patch's paths, applies it to the commit the agent started from,
  # commits, pushes `agent/<KEY>/<run>` and, if the agent succeeded, opens the PR. A failed agent's
  # partial work is still pushed (no PR) so Andy can inspect it.
  publish:
    needs: [context, agent]
    if: always() && needs.context.outputs.step == 'build' && needs.agent.outputs.has_change == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout; the push uses the App token
      id-token: write # Actions OIDC token for POST /github/token
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      pull_request: ${{ steps.push.outputs.pull_request }}
      tooling_files: ${{ steps.push.outputs.tooling_files }}
    steps:
      - name: Check out the agent's base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.agent.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: albernhagen/andy-intelligence
          ref: ${{ needs.context.outputs.platform_sha || 'main' }}
          path: .executor-platform
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts
            platform/executor

      - name: Download the change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: change-${{ inputs.run_id }}
          path: ${{ runner.temp }}/change

      # Thin caller: scripts/executor-publish.mjs from the platform checkout (at platform_sha, a
      # separate directory the agent never wrote) does apply, check, commit, token, push and PR.
      # Safety (holds a write token): the project checkout is the agent's base commit, the
      # change is applied as data and checked, and nothing from it runs here. The script passes
      # agent text only as arguments, files or JSON bodies, never through a shell, and never
      # prints the token, the report or the title. Keep `set -x` out of this step.
      - name: Publish the change
        id: push
        env:
          PATCH: ${{ runner.temp }}/change/change.patch
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ needs.context.outputs.branch }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          PROJECT_ID: ${{ needs.context.outputs.project_id }}
          TICKET_KEY: ${{ needs.context.outputs.ticket_key }}
          TICKET_TITLE: ${{ needs.context.outputs.ticket_title }}
          MODEL: ${{ needs.context.outputs.model }}
          REPORT: ${{ needs.agent.outputs.report }}
        run: |
          mv .executor-platform "$RUNNER_TEMP/platform"
          codeowners=""
          for f in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if [ -f "$f" ]; then codeowners="$f"; break; fi
          done
          PROFILE="$RUNNER_TEMP/platform/platform/executor/profile.json" CODEOWNERS="$codeowners" \
            node "$RUNNER_TEMP/platform/scripts/executor-publish.mjs" publish

  report:
    needs: [context, agent, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Actions OIDC token for POST /runs/{id}/report
    steps:
      - name: Report to the control plane
        env:
          RUN_ID: ${{ inputs.run_id }}
          REPORT: ${{ needs.agent.outputs.report }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          CONTEXT_ERROR: ${{ needs.context.outputs.error }}
          AGENT_RESULT: ${{ needs.agent.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CHANGE_ERROR: ${{ needs.agent.outputs.change_error }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          PULL_REQUEST: ${{ needs.publish.outputs.pull_request }}
          TOOLING_FILES: ${{ needs.publish.outputs.tooling_files }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]]; then
            echo "::error title=claude-executor::Invalid run_id; nothing to report to."
            exit 1
          fi
          body="$RUNNER_TEMP/report.json"
          if [ -n "$REPORT" ] && jq -e 'type == "object" and (.status == "succeeded" or .status == "failed")' <<<"$REPORT" > /dev/null 2>&1; then
            printf '%s' "$REPORT" > "$body"
          else
            if [ "$CONTEXT_RESULT" != success ]; then
              reason="Executor could not start: ${CONTEXT_ERROR:-context job $CONTEXT_RESULT}"
            else
              reason="Executor agent job $AGENT_RESULT before it built a report"
            fi
            jq -cn --arg s "$reason" '{status: "failed", summary: $s, tokensIn: null, tokensOut: null, costUsd: null}' > "$body"
          fi
          # Build: the publish job's branch and PR go with the report; a publish that failed after
          # a successful agent fails the run (the control plane retries it once).
          if [ -n "$CHANGE_ERROR" ]; then
            jq -c '.status = "failed" | .summary = (env.CHANGE_ERROR + "\n\n" + (.summary // ""))' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          elif [ "$PUBLISH_RESULT" = failure ] || [ "$PUBLISH_RESULT" = cancelled ]; then
            jq -c '.status = "failed" | .summary = ("The publish job " + env.PUBLISH_RESULT + ": the change was not pushed or no PR was opened.\n\n" + (.summary // ""))' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          fi
          jq -c '. + {branch: (if env.BRANCH == "" then null else env.BRANCH end), pullRequest: (if env.PULL_REQUEST == "" then null else env.PULL_REQUEST end), toolingFiles: ((env.TOOLING_FILES | try fromjson catch []) // [] | if type == "array" then .[:50] else [] end)}' "$body" > "$body.tmp" && mv "$body.tmp" "$body"
          echo "Reporting status: $(jq -r .status "$body")"

          response="$RUNNER_TEMP/report-response.txt"
          for attempt in 1 2 3; do
            code=000
            if oidc=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CONTROL_PLANE_URL" | jq -r .value) && [ -n "$oidc" ] && [ "$oidc" != null ]; then
              echo "::add-mask::$oidc"
              code=$(curl -sS --max-time 30 -o "$response" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
                --data-binary "@$body" "$CONTROL_PLANE_URL/runs/$RUN_ID/report") || code=000
            fi
            case "$code" in
              2??)
                echo "Reported run $RUN_ID (HTTP $code)."
                exit 0
                ;;
              000 | 5??)
                echo "::warning title=claude-executor::Report attempt $attempt failed (HTTP $code)."
                [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
                ;;
              *)
                echo "::error title=claude-executor::Control plane rejected the report: HTTP $code: $(head -c 300 "$response" | tr -d '\r\n')"
                exit 1
                ;;
            esac
          done
          echo "::error title=claude-executor::Could not report run $RUN_ID after 3 attempts."
          exit 1
