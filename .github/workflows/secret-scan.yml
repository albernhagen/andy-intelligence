name: Secret scan

# Public repo: block anything that looks like a credential before it lands on main (ADR-0015).
# Complements GitHub secret scanning + push protection. Project baseline caller (ADR-0038).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./platform/actions/secret-scan
