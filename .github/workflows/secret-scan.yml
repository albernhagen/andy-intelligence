name: Secret scan

# Public repo: block anything that looks like a credential before it lands on main.
# Complements GitHub secret scanning + push protection (enable in repo settings).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the commits in the PR/push range; fails on verified or unverifiable secrets.
      - uses: trufflesecurity/trufflehog@v3.99.3
        with:
          extra_args: --results=verified,unknown
