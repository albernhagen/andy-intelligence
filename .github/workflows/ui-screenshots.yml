name: UI screenshots

# Playwright screenshot checks for the web app (ADR-0059: Visual checks): the shell, board and
# ticket page against the real API over seeded fakes. Fails on a diff from
# apps/web/e2e/__screenshots__ and uploads the actual images. Steps: platform/actions/ui-screenshots.
# A docs-only PR reports a pass without running (AI-358); pushes to main always run.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-screenshots:
    runs-on: ubuntu-latest
    # Cap (ADR-0028); the Playwright config also caps the test run at 5 minutes.
    timeout-minutes: 10
    permissions:
      contents: read
    # Same image as `pnpm --filter @andy/web screenshots:update`, so fonts and rendering match.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./platform/actions/ui-screenshots
        with:
          base-ref: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
