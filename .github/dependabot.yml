# Dependabot version updates (ADR-0025). Action pins are commit SHAs with a version comment;
# Dependabot updates both. Caps: weekly, grouped, at most 5 open PRs per ecosystem (ADR-0028).
# cooldown waits a few days after a release, so a hijacked release is usually caught first.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node majors track the Node runtime in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the baseline's composite actions hold most pins (ADR-0038).
    directories:
      - /
      - /platform/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/control-plane
      - /infra/billing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
