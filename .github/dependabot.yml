# Dependabot version updates (ADR-0025). Action pins and base images are pinned by digest or
# commit SHA with a readable tag or version comment; Dependabot updates both. Caps: grouped, at
# most 5 open PRs per ecosystem (ADR-0028). npm is weekly; Actions, Terraform and Docker monthly
# (AI-399). Security updates are separate and do not wait for this schedule.
# cooldown waits a few days after a release, so a hijacked release is usually caught first.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspace (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # One PR for dev tooling, one for what ships; majors come one per package.
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]
        # Playwright gets a PR of its own: the screenshot job's browser image (pinned by digest in
        # a workflow) must move with it, and the job fails naming the fix until it does (AI-394).
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
      prod-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
    ignore:
      # @types/node majors track the Node runtime in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # `/` covers .github/workflows; the baseline's composite actions hold most pins (ADR-0038).
    directories:
      - /
      - /platform/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/control-plane
      - /infra/billing
      - /infra/dns
      - /infra/modules/project-env/examples/basic
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
        # One PR per provider covering every root above, not one PR per root (PR #204 to #207).
        group-by: dependency-name

  - package-ecosystem: docker
    # Root Dockerfile (the image prod runs), the sandbox lab (AI-58) and the starter Dockerfile
    # managed `cloud-run` projects are seeded with (AI-401). All pin tag@sha256.
    directories:
      - /
      - /scripts/sandbox-lab
      - /template/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Base image majors (node 24 → 26, ubuntu 24.04 → 26.04) move with .nvmrc and the
      # sandbox's NODE_VERSION by hand; Dependabot keeps the digest of the current tag fresh.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
